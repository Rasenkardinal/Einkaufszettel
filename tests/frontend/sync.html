<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Synchronization regression tests</title>
<pre id="results">Running...</pre>
<script>
async function runTests() {
  const source = await (await fetch("../../custom_components/einkaufszettel/www/app.js")).text();
  const persistence = source.slice(source.indexOf("let localUpdates ="), source.indexOf("function render()"));
  const selection = source.slice(source.indexOf("async function loadSelectedList()"), source.indexOf("async function selectList("));
  const protocol = source.slice(source.indexOf("function scheduleSynchronization()"), source.indexOf("async function loadRemoteLists()"));
  const productHelpers = source.slice(source.indexOf("function productNameKey("), source.indexOf("function cacheCatalog("));
  const productReplay = source.slice(source.indexOf("function replayProductAssignments("), source.indexOf("function button("));
  const results = [];
  const assert = (value, message) => { if (!value) throw Error(message); };
  const deferred = () => {
    let resolve, reject;
    const promise = new Promise((yes, no) => { resolve = yes; reject = no; });
    return { promise, resolve, reject };
  };
  function server(env, snapshots) {
    const calls = [];
    env.send = async (type, payload) => {
      if (type.endsWith("/get_catalog")) return {categories:[],supermarkets:[],products:[]};
      calls.push({ type, ...payload });
      const snapshot = snapshots[payload.entry_id];
      if (type.endsWith("/apply_operation")) {
        const { action, uid, changes } = payload;
        if (action === "delete_item") snapshot.items = snapshot.items.filter(item => item.uid !== uid);
        else if (action === "add_item") snapshot.items.push({uid, status:"needs_action", ...changes});
        else snapshot.items = snapshot.items.map(item => item.uid === uid ? {...item, ...changes,
          ...(changes.metadata ? {metadata:{...item.metadata, ...changes.metadata}} : {})} : item);
        snapshot.revision++;
        return structuredClone({...snapshot, ack_operation_id:payload.operation_id, operation_result:"applied"});
      }
      return structuredClone(snapshot);
    };
    return calls;
  }
  async function fixture(test) {
    const name = `einkaufszettel-sync-test-${crypto.randomUUID()}`;
    const database = await new Promise((resolve, reject) => {
      const request = indexedDB.open(name, 1);
      request.onupgradeneeded = () => {
        request.result.createObjectStore("lists", { keyPath: "entry_id" });
        request.result.createObjectStore("operations", { keyPath: "id" });
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
    const env = { database, states: [], renders: [], busyStates: [], send: async () => { throw Error("Unexpected network"); } };
    const fixtureRoot = document.createElement("div");
    fixtureRoot.innerHTML = '<button id="test-conflict-trigger"></button><dialog id="test-conflict-dialog"><p id="test-conflict-message"></p><div id="test-conflict-content"></div></dialog>';
    document.body.append(fixtureRoot);
    env.conflictElements = {
      resolveSyncConflicts: fixtureRoot.querySelector("button"),
      syncConflicts: fixtureRoot.querySelector("dialog"),
      syncConflictsMessage: fixtureRoot.querySelector("p"),
      syncConflictsContent: fixtureRoot.querySelector("div"),
    };
    env.confirm = () => false;
    const create = new Function("env", `
      const { database } = env;
      const DOMAIN = "einkaufszettel", WebSocket = { OPEN: 1 }, socket = { readyState: 1 };
      const elements = { listName: { textContent: "Test" }, message: { textContent: "" }, ...env.conflictElements };
      const confirm = text => env.confirm(text);
      let entryId = "a", currentItems = [], deletedUids = new Set(), pendingOperations = [],
        lastOperationTime = 0, busy = false, authenticated = false;
      let syncPromise, syncRequested = false, fullSyncRequested = false, syncTimer, listRefreshPromise;
      let products = [];
      const cacheCatalog = () => {};
      const refreshSupermarkets = async () => {};
      ${productHelpers}
      ${productReplay}
      let availableLists = [{ entry_id: "a", name: "Test" }];
      const setBusy = value => { busy = value; env.busyStates.push(value); };
      const render = () => { env.renders.push(structuredClone(currentItems)); };
      const renderListSelection = () => {}, loadMarketSelection = () => {};
      const updateConnection = (state, message) => env.states.push({ state, message });
      const showError = error => { elements.message.textContent = error.message; };
      const sendCommand = (type, payload) => env.send(type, payload);
      async function readCachedLists() {
        return new Promise((resolve, reject) => {
          const request = database.transaction("lists").objectStore("lists").getAll();
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }
      ${persistence}
      ${selection}
      ${protocol}
      return { enqueue, readQueue, saveList, loadSelectedList, synchronize, acknowledgeOperation, scheduleSynchronization,
        refreshSyncConflicts, openSyncConflicts, resolveSyncConflict,
        online: () => { authenticated = true; },
        offline: () => { authenticated = false; },
        flush: () => syncPromise,
        lists: value => { availableLists = value; },
        select: async id => { entryId = id; await loadSelectedList(); },
        state: () => ({ currentItems, pendingOperations, products, message: elements.message.textContent, busy, syncing: !!syncPromise }) };
    `);
    const api = create(env);
    try { await test(api, env); }
    finally {
      api.offline();
      fixtureRoot.remove();
      database.close();
      await new Promise((resolve, reject) => {
        const request = indexedDB.deleteDatabase(name);
        request.onsuccess = resolve; request.onerror = () => reject(request.error);
      });
    }
  }
  async function test(name, fn) { await fixture(fn); results.push(`PASS ${name}`); }

  await test("Offline patches retain metadata and revision across reload", async api => {
    await api.saveList({ entry_id: "a", name: "A", revision: 7, deleted_uids: ["deleted"],
      items: [{ uid: "one", summary: "Milk", status: "needs_action", metadata: { category_id: "dairy", quantity: "1" } }] });
    await api.loadSelectedList();
    await api.enqueue({ type: "update_item", uid: "one", metadata: { quantity: "2" } });
    await api.loadSelectedList();
    assert(api.state().currentItems[0].metadata.category_id === "dairy", "Category lost");
    assert(api.state().currentItems[0].metadata.quantity === "2", "Quantity lost");
    await api.enqueue({ type: "add_item", uid: "deleted", summary: "Must not reappear" });
    assert(api.state().currentItems.length === 1, "Tombstone ignored");
  });

  await test("Lost acknowledgement retries the same operation without replacing newer data", async (api, env) => {
    let server = { entry_id: "a", name: "A", revision: 1, items: [{ uid: "one", summary: "Milk", status: "needs_action" }] };
    await api.saveList(server); await api.loadSelectedList();
    await api.enqueue({ type: "update_item", uid: "one", summary: "Oat milk" });
    const operation = (await api.readQueue())[0];
    let loseReply = true, applied = 0;
    const receipts = new Set();
    env.send = async (type, payload) => {
      if (type.endsWith("/apply_operation")) {
        assert(payload.operation_id === operation.id, "Operation identity changed");
        assert(!("created_at" in payload), "Client clock used for ordering");
        if (!receipts.has(payload.operation_id)) {
          applied++; receipts.add(payload.operation_id);
          server = { ...server, revision: 2, items: [{ ...server.items[0], ...payload.changes }] };
        }
        if (loseReply) { loseReply = false; throw Error("Lost response"); }
        return { ...server, ack_operation_id: payload.operation_id, operation_result: "applied" };
      }
      return server;
    };
    api.online();
    let failed = false;
    try { await api.synchronize(); } catch { failed = true; }
    assert(failed && (await api.readQueue()).length === 1, "Unconfirmed queue removed");
    server.items[0].summary = "Newer edit from another device";
    await api.synchronize();
    assert(applied === 1 && !(await api.readQueue()).length, "Retry not idempotent");
    assert(api.state().currentItems[0].summary === server.items[0].summary, "Newer edit overwritten");
  });

  await test("Failed local acknowledgement never consumes the queued operation", async api => {
    await api.enqueue({ type: "add_item", uid: "one", summary: "Milk" });
    const operation = (await api.readQueue())[0];
    let failed = false;
    try { await api.acknowledgeOperation({ items: [] }, operation.id); } catch { failed = true; }
    assert(failed && (await api.readQueue()).length === 1, "Queue was consumed");
  });

  await test("Deleted acknowledgements and source failures remain visible, including inactive lists", async (api, env) => {
    await api.enqueue({ type: "add_item", uid: "old", summary: "Milk" });
    const snapshots = {
      a: { entry_id: "a", name: "A", revision: 2, deleted_uids: ["old"], items: [], source_error: "Source unavailable" },
      b: { entry_id: "b", name: "B", revision: 1, items: [] },
    };
    await api.saveList(snapshots.b);
    await api.select("b");
    // The real app keeps all enabled lists in availableLists; this fixture's A remains inactive.
    env.send = async (type, payload) => ({
      ...snapshots[payload.entry_id],
      ...(type.endsWith("/apply_operation") ? { ack_operation_id: payload.operation_id, operation_result: "deleted" } : {}),
    });
    api.online(); await api.synchronize();
    assert(!(await api.readQueue("a")).length, "Inactive queue not synchronized");
    assert(api.state().message.includes("gelöschten") && api.state().message.includes("Source unavailable"), "Warnings hidden");
    await api.select("a");
    assert(!api.state().currentItems.length, "Deleted article resurrected");
  });

  await test("Conflicts prompt once and a cancelled retry never sends a command", async (api, env) => {
    const conflict = { uid: "one", summary: "Brot", token: "attempt-1", candidates: [], reason: "unconfirmed" };
    await api.saveList({ entry_id: "a", name: "Test", items: [], source_conflicts: [conflict] });
    await api.refreshSyncConflicts();
    assert(env.conflictElements.syncConflicts.open, "No prompt");
    const retry = [...env.conflictElements.syncConflictsContent.querySelectorAll("button")]
      .find(button => button.textContent === "Bewusst erneut anlegen");
    let confirms = 0;
    env.confirm = () => { confirms++; return false; };
    retry.click();
    assert(confirms === 1, "Retry lacked confirmation");
    env.conflictElements.syncConflicts.close();
    await api.refreshSyncConflicts();
    assert(!env.conflictElements.syncConflicts.open, "Repeated nagging for same attempt");
    env.conflictElements.resolveSyncConflicts.click();
    assert(env.conflictElements.syncConflicts.open, "Cannot reopen deferred conflict");
  });

  await test("Conflict decisions carry list and attempt identity; failures preserve dialog", async (api, env) => {
    const conflict = {
      entry_id: "a", uid: "one", summary: "Brot", token: "attempt-1", reason: "multiple",
      candidates: [{ uid: "r1", summary: "Brot", status: "needs_action" }],
    };
    let snapshot = { entry_id: "a", name: "Test", revision: 1, items: [], source_conflicts: [conflict] };
    await api.saveList(snapshot);
    await api.refreshSyncConflicts();
    const linkButton = [...env.conflictElements.syncConflictsContent.querySelectorAll("button")]
      .find(button => button.textContent === "Quellartikel zuordnen");
    linkButton.click();
    assert(env.conflictElements.syncConflictsMessage.textContent.includes("zuerst"), "Missing source selection not reported");
    let failed = false, sends = 0;
    env.send = async (type, payload) => {
      assert(type.endsWith("/resolve_source_conflict"), "Wrong command");
      assert(payload.entry_id === "a" && payload.uid === "one" && payload.token === "attempt-1", "Missing identity");
      assert(payload.source_uid === "r1", "Missing selected source identity");
      sends++;
      throw Error("Stale conflict");
    };
    try { await api.resolveSyncConflict(conflict, "link", "r1"); } catch { failed = true; }
    assert(failed && env.conflictElements.syncConflicts.open, "Error hidden");
    assert(!env.conflictElements.syncConflictsContent.inert, "Dialog stuck busy");
    env.send = async (type, payload) => {
      if (type.endsWith("/resolve_source_conflict")) {
        assert(payload.action === "local", "Wrong decision");
        sends++;
        snapshot = { ...snapshot, source_conflicts: [] };
      }
      return snapshot;
    };
    await api.resolveSyncConflict(conflict, "local");
    assert(sends === 2 && !env.conflictElements.syncConflicts.open, "Successful resolution not applied");
    assert(env.conflictElements.resolveSyncConflicts.hidden, "Stale conflict trigger");
  });

  await test("An open dialog follows decisions from another device and local-only stays reachable", async (api, env) => {
    const conflict = { uid: "one", summary: "Brot", token: "old", candidates: [], reason: "unconfirmed" };
    const snapshot = { entry_id: "a", name: "A", items: [], source_conflicts: [conflict] };
    await api.saveList(snapshot);
    await api.refreshSyncConflicts();
    await api.saveList({ ...snapshot, source_conflicts: [],
      source_local_items: [{ ...conflict, token: "local", local_only: true }] });
    await api.refreshSyncConflicts();
    assert(env.conflictElements.syncConflictsContent.textContent.includes("bleibt nur lokal"), "Open dialog kept stale decision");
    env.conflictElements.syncConflicts.close();
    await api.refreshSyncConflicts();
    assert(!env.conflictElements.syncConflicts.open, "Local-only prompted again");
    assert(env.conflictElements.resolveSyncConflicts.textContent.includes("Nur lokale"), "No return path for local-only");
    env.conflictElements.resolveSyncConflicts.click();
    assert(env.conflictElements.syncConflicts.open, "Cannot revisit local-only");
    await api.saveList({ ...snapshot, source_conflicts: [] });
    await api.refreshSyncConflicts();
    assert(!env.conflictElements.syncConflicts.open && env.conflictElements.resolveSyncConflicts.hidden, "Resolved dialog remained stale");
  });

  await test("Deleted local-only leftovers are not presented as existing articles", async (api, env) => {
    await api.saveList({ entry_id: "a", name: "A", items: [], source_conflicts: [],
      source_local_items: [{uid:"deleted", summary:"Milch", token:"old", candidates:[], local_only:true, deleted:true}] });
    await api.refreshSyncConflicts();
    assert(env.conflictElements.resolveSyncConflicts.hidden, "Deleted item counted as local article");
    assert(!env.conflictElements.syncConflicts.open, "Deleted local-only item prompted");
  });

  await test("Status distinguishes waiting decisions and intentionally app-only articles", async (api, env) => {
    const conflict = {uid:"one", summary:"Milch", token:"new", candidates:[], reason:"unconfirmed"};
    let snapshot = {entry_id:"a", name:"A", revision:1, items:[], source_conflicts:[conflict]};
    env.send = async () => snapshot;
    api.online();
    await api.synchronize();
    assert(env.states.at(-1).message.includes("Entscheidung nötig"), "Unresolved article reported as full success");
    assert(env.conflictElements.syncConflictsContent.textContent.includes("Beispiel"), "Missing understandable examples");
    assert(env.conflictElements.syncConflictsContent.textContent.includes("für alle Geräte"), "Local-only misunderstood as device-only");
    snapshot = {...snapshot, source_conflicts:[], source_local_items:[{...conflict, local_only:true}]};
    await api.synchronize();
    assert(env.states.at(-1).message.includes("nur in der App-Liste"), "App-only article reported as fully synchronized");
  });

  await test("A deleted conflict explains deletion, never retention or recreation", async (api, env) => {
    const conflict = {uid:"one", summary:"Milch", token:"deleted", candidates:[], deleted:true, reason:"unconfirmed"};
    await api.saveList({entry_id:"a", name:"A", items:[], source_conflicts:[conflict]});
    await api.refreshSyncConflicts();
    const text = env.conflictElements.syncConflictsContent.textContent;
    assert(text.includes("Löschung hier abschließen") && text.includes("bleibt hier gelöscht"), "Deletion semantics missing");
    assert(!text.includes("Nur lokal behalten") && !text.includes("nicht, dass er verloren"), "Deleted item described as existing");
    const retry = [...env.conflictElements.syncConflictsContent.querySelectorAll("button")]
      .find(button => button.textContent === "Bewusst erneut anlegen");
    assert(retry.disabled, "Deleted article can be recreated");
  });

  await test("Delayed acknowledgements never block rapid changes or overwrite newer local patches", async (api, env) => {
    const snapshots = {a:{entry_id:"a", name:"A", revision:1, items:[
      {uid:"one", summary:"Milch", status:"needs_action", metadata:{category_id:"dairy"}},
      {uid:"two", summary:"Brot", status:"needs_action"},
    ]}};
    const calls = server(env, snapshots);
    const normal = env.send, entered = deferred(), release = deferred();
    let held = false, requests = 0, peak = 0;
    env.send = async (type, payload) => {
      requests++; peak = Math.max(peak, requests);
      try {
        const reply = await normal(type, payload);
        if (!held && type.endsWith("/apply_operation")) {
          held = true; entered.resolve(); await release.promise;
        }
        return reply;
      } finally { requests--; }
    };
    await api.saveList(snapshots.a); await api.loadSelectedList();
    await api.enqueue({type:"update_item", uid:"one", status:"completed"});
    api.online();
    const syncing = api.synchronize();
    await entered.promise;
    const start = performance.now();
    await Promise.all([
      api.enqueue({type:"update_item", uid:"one", status:"needs_action"}),
      api.enqueue({type:"update_item", uid:"one", metadata:{quantity:"2"}}),
      api.enqueue({type:"delete_item", uid:"two"}),
      api.enqueue({type:"add_item", uid:"three", summary:"Obst"}),
    ]);
    assert(performance.now() - start < 250, "Local actions waited for network");
    assert(!api.state().busy && api.state().syncing, "Network set global UI lock");
    assert(api.state().currentItems.find(i=>i.uid==="one").status === "needs_action", "Newer toggle not shown");
    assert(!api.state().currentItems.some(i=>i.uid==="two"), "Delete not shown immediately");
    const again = api.synchronize();
    release.resolve();
    await Promise.all([syncing, again]);
    if (api.flush()) await api.flush();
    assert(peak === 1, "Overlapping network syncs");
    assert(!(await api.readQueue()).length, "Newly enqueued changes stranded");
    assert(calls.filter(c=>c.type.endsWith("/apply_operation")).length === 5, "Action lost or sent twice");
    assert(!env.busyStates.includes(true), "Background sync blocked UI");
    for (const state of env.renders.slice(-3)) {
      assert(!state.some(i=>i.uid==="two"), "Deleted item flashed back from old response");
      assert(state.find(i=>i.uid==="one")?.status === "needs_action", "Old acknowledgement reverted newer status");
    }
    const item = api.state().currentItems.find(i=>i.uid==="one");
    assert(item.metadata.category_id === "dairy" && item.metadata.quantity === "2", "Metadata overlay lost");
  });

  await test("A slow source read permits list switching and sends each action to its captured list", async (api, env) => {
    const snapshots = {
      a:{entry_id:"a", name:"A", revision:1, items:[{uid:"a1",summary:"Milch",status:"needs_action"}]},
      b:{entry_id:"b", name:"B", revision:1, items:[{uid:"b1",summary:"Brot",status:"needs_action"}]},
    };
    api.lists([{entry_id:"a",name:"A"},{entry_id:"b",name:"B"}]);
    await api.saveList(snapshots.a); await api.saveList(snapshots.b); await api.loadSelectedList();
    const calls = server(env, snapshots), normal = env.send, entered = deferred(), release = deferred();
    let held = false;
    env.send = async (type, payload) => {
      const reply = await normal(type, payload);
      if (!held && type.endsWith("/sync_source")) { held = true; entered.resolve(); await release.promise; }
      return reply;
    };
    api.online();
    const syncing = api.synchronize();
    await entered.promise;
    await api.enqueue({type:"update_item",uid:"a1",status:"completed"});
    await api.select("b");
    await api.enqueue({type:"delete_item",uid:"b1"});
    assert(!api.state().currentItems.length, "List B delete waited for source A");
    release.resolve(); await syncing;
    if (api.flush()) await api.flush();
    assert(!api.state().currentItems.length, "Source A rendered into list B");
    assert(!(await api.readQueue("a")).length && !(await api.readQueue("b")).length, "Queue stranded after switching");
    assert(calls.filter(c=>c.type.endsWith("/apply_operation")).every(c=>
      c.uid === "a1" ? c.entry_id === "a" : c.entry_id === "b"), "Action assigned to wrong list");
  });

  await test("Burst edits are batched and do not poll unaffected source lists", async (api, env) => {
    const snapshots = {a:{entry_id:"a", name:"A", revision:1, items:[]}, b:{entry_id:"b", name:"B", revision:1, items:[]}};
    api.lists([{entry_id:"a",name:"A"},{entry_id:"b",name:"B"}]);
    await api.saveList(snapshots.a); await api.loadSelectedList();
    const calls = server(env, snapshots);
    api.online();
    await Promise.all(Array.from({length:8}, (_, index)=>api.enqueue({type:"add_item",uid:`item-${index}`,summary:`Artikel ${index}`})));
    assert(calls.length === 0, "No debounce for burst");
    await new Promise(resolve=>setTimeout(resolve,200));
    if (api.flush()) await api.flush();
    assert(calls.filter(c=>c.type.endsWith("/apply_operation")).length === 8, "Burst action missing");
    assert(calls.filter(c=>c.type.endsWith("/sync_source")).length === 1, "Source called for every action or unaffected list");
    assert(calls.every(c=>c.entry_id === "a"), "Unaffected list polled");
    assert(!(await api.readQueue()).length && api.state().currentItems.length === 8, "Burst not persisted");
  });

  await test("A network failure keeps concurrent changes durable and editing remains possible", async (api, env) => {
    await api.saveList({entry_id:"a",name:"A",revision:1,items:[{uid:"one",summary:"Milch",status:"needs_action"}]});
    await api.loadSelectedList();
    const entered = deferred(), release = deferred();
    env.send = async () => {entered.resolve(); await release.promise; throw Error("Network lost");};
    api.online();
    const outcome = api.synchronize().then(()=>false, ()=>true);
    await entered.promise;
    await api.enqueue({type:"update_item",uid:"one",status:"completed"});
    api.offline(); release.resolve();
    assert(await outcome, "Failure hidden");
    await api.enqueue({type:"add_item",uid:"two",summary:"Brot"});
    await api.loadSelectedList();
    assert(!api.state().busy && !api.state().syncing, "UI stuck after error");
    assert((await api.readQueue()).length === 2, "Unconfirmed actions lost");
    assert(api.state().currentItems.find(i=>i.uid==="one").status === "completed", "Durable overlay lost after error/reload");
    assert(api.state().currentItems.some(i=>i.uid==="two"), "Editing stopped after error");
  });

  await test("Offline category assignments survive article deletion and apply to new names on other lists", async api => {
    await api.saveList({entry_id:"a",name:"A",items:[{uid:"milk",summary:"Milch",status:"needs_action"}]});
    await api.saveList({entry_id:"b",name:"B",items:[]});
    await api.loadSelectedList();
    await api.enqueue({type:"update_item",uid:"milk",metadata:{category_id:"dairy"}});
    await api.enqueue({type:"delete_item",uid:"milk"});
    await api.select("b");
    await api.enqueue({type:"add_item",uid:"fresh",summary:" MILCH "});
    assert(api.state().currentItems[0].metadata.category_id==="dairy", "New article on another list did not inherit offline rule");
    assert(api.state().products.find(product=>product.key==="milch").category_id==="dairy", "Deleting article deleted product rule");
    await api.loadSelectedList();
    assert(api.state().currentItems[0].metadata.category_id==="dairy", "Reload lost pending category rule from other list");
    await api.enqueue({type:"update_item",uid:"fresh",metadata:{category_id:null}});
    await api.enqueue({type:"delete_item",uid:"fresh"});
    await api.enqueue({type:"add_item",uid:"again",summary:"Milch"});
    assert(api.state().currentItems[0].metadata.category_id===null, "Explicit category removal was relearned");
  });

  await test("Real UI stays interactive during a delayed response, including check, delete and add", async (api, env) => {
    const snapshots = {a:{entry_id:"a",name:"A",revision:1,items:[
      {uid:"one",summary:"Milch",status:"needs_action"},
      {uid:"two",summary:"Brot",status:"needs_action"},
      {uid:"three",summary:"Obst",status:"needs_action"},
    ]}};
    await api.saveList(snapshots.a);
    server(env, snapshots);
    const normal = env.send, entered = deferred(), release = deferred();
    let held = false, ui;
    env.send = async (type, payload) => {
      const reply = await normal(type, payload);
      if (!held && type.endsWith("/apply_operation")) {
        held = true; entered.resolve(); await release.promise;
      }
      return reply;
    };
    const base = "../../custom_components/einkaufszettel/www/";
    const markup = await (await fetch(base + "app.html")).text();
    const frame = document.createElement("iframe");
    frame.title = "Background synchronization UI regression";
    frame.style.cssText = "width:390px;height:844px;border:0";
    frame.srcdoc = markup.replace(/<script src="[^"]+" defer><\/script>/, "")
      .replace("<head>", `<head><base href="${new URL(base, location.href)}">`);
    document.body.append(frame);
    await new Promise(resolve=>frame.onload=resolve);
    const win=frame.contentWindow, doc=win.document;
    const storage=new Map();
    win.confirm=()=>true;
    const waitFor = async predicate => {
      const deadline=performance.now()+1500;
      while (!predicate()) {
        if (performance.now()>deadline) throw Error("UI operation did not complete locally");
        await new Promise(resolve=>setTimeout(resolve,5));
      }
    };
    try {
      ui=win.Function("test","localStorage", source.replace(/initializeDesign\(\);\s*start\(\);\s*$/,"")+`
        database=test.database; entryId="a"; availableLists=[{entry_id:"a",name:"A"}];
        socket={readyState:WebSocket.OPEN}; authenticated=true;
        sendCommand=(type,payload)=>test.send(type,payload);
        return {loadSelectedList,enqueue,loadRemoteLists,
          flush:()=>syncPromise,
          state:()=>({busy,items:currentItems,pending:pendingOperations,syncing:!!syncPromise}),
          stop:()=>{authenticated=false;window.clearTimeout(syncTimer);}
        };
      `)({database:env.database,send:(...args)=>env.send(...args)},
        {getItem:key=>storage.get(key)||null,setItem:(key,value)=>storage.set(key,value),removeItem:key=>storage.delete(key)});
      await ui.loadSelectedList();
      doc.querySelector('[aria-label="Erledigt: Milch"]').click();
      await entered.promise;
      assert(ui.state().syncing && !ui.state().busy, "Real app globally busy during network wait");
      assert(!doc.querySelector("#items").inert && !doc.querySelector("#add-form").inert, "List/form inert during sync");
      assert(!doc.querySelector("#list-select").disabled && !doc.querySelector("#market-select").disabled, "Pickers blocked");
      const start=performance.now();
      doc.querySelector('[aria-label="Erledigt: Obst"]').click();
      doc.querySelector('[aria-label="Bearbeiten: Brot"]').dispatchEvent(new win.KeyboardEvent("keydown",{key:"Delete",bubbles:true}));
      doc.querySelector("#new-item").value="Kaffee";
      doc.querySelector("#add-form").requestSubmit();
      await waitFor(()=>ui.state().pending.length===4);
      assert(performance.now()-start<250, "Real UI actions waited for delayed response");
      assert(!ui.state().items.some(item=>item.uid==="two"), "Delete not visible while network blocked");
      assert(ui.state().items.find(item=>item.uid==="three").status==="completed", "Checkbox not updated locally");
      assert(doc.querySelector("#new-item").value==="", "Add form waited for network");
      assert(doc.querySelector("#items").textContent.includes("Kaffee"), "New article missing");
      for (const summary of ["Milch","Kaffee"]) {
        const row=doc.querySelector(`[aria-label="Bearbeiten: ${summary}"]`).closest(".item");
        row.dispatchEvent(new win.PointerEvent("pointerdown",{pointerId:17,button:0,clientX:200,clientY:20,bubbles:true}));
        row.dispatchEvent(new win.PointerEvent("pointermove",{pointerId:17,clientX:90,clientY:20,bubbles:true}));
        row.dispatchEvent(new win.PointerEvent("pointerup",{pointerId:17,clientX:90,clientY:20,bubbles:true}));
      }
      assert(!doc.querySelector("#items").inert && !doc.querySelector("#add-form").inert, "Swipe animations locked other controls");
      doc.querySelector("#new-item").value="Tee";
      doc.querySelector("#add-form").requestSubmit();
      await waitFor(()=>ui.state().pending.length===7);
      assert(!ui.state().items.some(item=>["Milch","Kaffee"].includes(item.summary)), "Parallel swipe deletes not applied");
      assert(ui.state().items.some(item=>item.summary==="Tee"), "Add blocked during swipes");
      // Hold the reply longer than an ordinary shopping action, not just one microtask.
      await new Promise(resolve=>setTimeout(resolve,1500));
      assert(ui.state().syncing && !doc.querySelector("#items").inert, "Long latency eventually locked UI");
      release.resolve();
      if(ui.flush()) await ui.flush();
      await waitFor(()=>!ui.state().syncing);
      assert(ui.state().pending.length===0, "UI queue not acknowledged");
      assert(!doc.querySelector("#items").textContent.includes("Brot"), "Deleted article reappeared");
      const listRequest=deferred(), listReply=deferred();
      env.send=async (type,payload)=>{
        if(type.endsWith("/get_catalog")) return {categories:[],supermarkets:[]};
        if(type.endsWith("/get_lists")) {
          listRequest.resolve(); await listReply.promise;
          return [{entry_id:"a",name:"A"}];
        }
        return normal(type,payload);
      };
      const refreshing=ui.loadRemoteLists();
      await listRequest.promise;
      assert(!ui.state().busy && !doc.querySelector("#add-form").inert, "Manual refresh locked UI");
      doc.querySelector("#new-item").value="Honig";
      doc.querySelector("#add-form").requestSubmit();
      await waitFor(()=>ui.state().items.some(item=>item.summary==="Honig"));
      listReply.resolve();
      await refreshing;
      if(ui.flush()) await ui.flush();
      assert(ui.state().items.some(item=>item.summary==="Honig"), "Manual refresh lost concurrent add");
    } finally {
      release.resolve();
      if(ui) {
        ui.stop();
        if(ui.flush()) await ui.flush();
      }
      frame.remove();
    }
  });

  document.querySelector("#results").textContent = results.join("\n");
  document.body.dataset.result = "passed";
}
runTests().catch(error => {
  document.querySelector("#results").textContent = `FAIL ${error.stack}`;
  document.body.dataset.result = "failed";
});
</script>
</html>
