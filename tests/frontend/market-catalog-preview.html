<!doctype html>
<html lang="de">
<meta charset="utf-8">
<title>Supermarkt bearbeiten · Katalog-Picker-Test</title>
<pre id="results">Running...</pre>
<iframe id="fixture" title="Supermarkt bearbeiten" style="width:390px;height:844px;border:0"></iframe>
<script>
async function runTests() {
  const base = "../../custom_components/einkaufszettel/www/";
  const [markup, script] = await Promise.all(["app.html", "app.js"].map(file =>
    fetch(base + file, {cache:"no-store"}).then(response => response.text())));
  const frame = document.querySelector("#fixture");
  frame.srcdoc = markup.replace(/<script src="[^"]+" defer><\/script>/, "")
    .replace("<head>", `<head><base href="${new URL(base, location.href)}">`);
  await new Promise(resolve => frame.onload = resolve);
  const win = frame.contentWindow, doc = win.document, saves = [];
  const storage = {getItem: () => null, setItem() {}, removeItem() {}};
  const api = win.Function("test", "localStorage",
    script.replace(/initializeDesign\(\);\s*start\(\);\s*$/, "") + `
      entryId = "test"; busy = false;
      supermarkets = [{id:"market",name:"Kaufland",category_ids:[]}];
      categories = []; products = [];
      saveCatalog = (...args) => test.saves.push(args);
      const open = () => openCatalog("market-edit", supermarkets[0]);
      open();
      return {open, dirty: () => catalogDirty, state: () => JSON.stringify({supermarkets,categories,products})};
    `)({saves}, storage);
  const assert = (condition, message) => { if (!condition) throw Error(message); };
  const results = [], original = api.state();
  let details = doc.querySelector(".market-catalog-preview");
  assert(details && !details.open, "Catalog option should initially be collapsed");
  assert(details.querySelector(".market-catalog-current").textContent === "Supermarkt", "Default catalog missing");
  assert(details.previousElementSibling.classList.contains("category-navigation") &&
    details.nextElementSibling.classList.contains("market-checkout-options"), "Option is not before checkout settings");
  assert(!details.querySelector("select, input[type=radio]"), "Native selector or radio button remains");
  const navigation = [...doc.querySelectorAll("#catalog-page .category-navigation")];
  const catalogCard = details.querySelector("summary");
  assert(navigation.length === 2 &&
    Math.abs(navigation[1].getBoundingClientRect().top - navigation[0].getBoundingClientRect().bottom - 12) <= 1 &&
    Math.abs(catalogCard.getBoundingClientRect().top - navigation[1].getBoundingClientRect().bottom - 12) <= 1,
  "Navigation and catalog controls do not have identical 12px spacing");
  const checkoutOptions = details.nextElementSibling;
  const [receiptOption, bonusOption] = [...checkoutOptions.querySelectorAll(".market-checkout-option")];
  const deleteSection = checkoutOptions.nextElementSibling;
  const lineCenters = [
    checkoutOptions.getBoundingClientRect().top + 0.5,
    bonusOption.getBoundingClientRect().top + 0.5,
    deleteSection.getBoundingClientRect().top + 0.5,
  ];
  const switchCenters = [receiptOption, bonusOption].map(option => {
    const toggle = option.querySelector("input").getBoundingClientRect();
    return toggle.top + toggle.height / 2;
  });
  assert(switchCenters.every((center, index) =>
    Math.abs(center - (lineCenters[index] + lineCenters[index + 1]) / 2) <= 1),
  "Checkout switches are not centered between their dividers");
  const trigger = details.querySelector('[role="combobox"]');
  assert(trigger && trigger.getAttribute("aria-haspopup") === "listbox" &&
    trigger.getAttribute("aria-describedby") === "market-catalog-notice", "Picker accessibility metadata missing");
  const info = doc.querySelector("#catalog-page .management-help-trigger");
  assert(info.previousElementSibling.id === "catalog-title" && info.nextElementSibling.id === "catalog-close", "Info is not directly next to the title");
  info.click();
  assert(!doc.querySelector("#catalog-help-popover").hidden, "Existing title help stopped working");
  info.click();
  details.querySelector("summary").click();
  assert(details.open, "Catalog option does not expand");
  assert(details.querySelector(".market-catalog-notice").textContent.includes("nicht gespeichert"), "Preview notice missing");
  assert(details.querySelectorAll("p").length === 3, "Expected only the preview notice and catalog labels");
  const options = [...details.querySelectorAll('[role="option"]')];
  assert(options.map(option => option.textContent.trim()).join("|") ===
    "Supermarkt✓|Baumarkt✓|Aufgaben✓|Eigener Katalog …✓", "Catalog options do not match the approved choices");
  trigger.focus();
  trigger.dispatchEvent(new win.KeyboardEvent("keydown", {key:"ArrowDown", bubbles:true}));
  assert(trigger.getAttribute("aria-expanded") === "true" &&
    doc.activeElement.dataset.catalogValue === "supermarket", "ArrowDown did not open and focus the selected option");
  doc.activeElement.dispatchEvent(new win.KeyboardEvent("keydown", {key:"ArrowDown", bubbles:true}));
  assert(doc.activeElement.dataset.catalogValue === "hardware", "ArrowDown did not move through options");
  doc.activeElement.click();
  assert(trigger.getAttribute("aria-expanded") === "false" &&
    details.querySelector(".market-catalog-current").textContent === "Baumarkt", "Selecting a catalog did not update the preview");
  trigger.dispatchEvent(new win.KeyboardEvent("keydown", {key:"ArrowDown", bubbles:true}));
  doc.activeElement.dispatchEvent(new win.KeyboardEvent("keydown", {key:"Escape", bubbles:true}));
  assert(trigger.getAttribute("aria-expanded") === "false" && doc.activeElement === trigger &&
    details.querySelector(".market-catalog-current").textContent === "Baumarkt", "Escape did not close the picker and restore focus");
  trigger.dispatchEvent(new win.KeyboardEvent("keydown", {key:"ArrowDown", bubbles:true}));
  doc.activeElement.dispatchEvent(new win.KeyboardEvent("keydown", {key:"End", bubbles:true}));
  assert(doc.activeElement.dataset.catalogValue === "custom", "End did not focus the custom catalog option");
  doc.activeElement.click();
  const name = details.querySelector("input");
  assert(!name.hidden, "Custom catalog name field not shown");
  name.value = "Garten";
  name.dispatchEvent(new win.Event("input", {bubbles:true}));
  assert(!api.dirty() && api.state() === original, "Dummy changed shared state");
  assert(details.querySelector(".market-catalog-current").textContent === "Garten", "Custom catalog name is not reflected in the picker");
  details.closest("form").requestSubmit();
  assert(saves.length === 1, "Normal save no longer works");
  assert(JSON.stringify(saves[0]) === JSON.stringify(["save_supermarket", {
    market_id:"market", name:"Kaufland", deposit_receipt_hint:true, show_bonus_card:true,
  }, "markets"]), "Dummy values leaked into save payload");
  results.push("PASS Expandable catalog selector, custom name and explicit notice; no state, dirty flag or save payload changes");
  api.open();
  details = doc.querySelector(".market-catalog-preview");
  assert(!details.open && details.querySelector(".market-catalog-current").textContent === "Supermarkt" &&
    details.querySelector("input").value === "", "Preview values persisted after reopening");
  details.querySelector("summary").click();
  for (const width of [320,390,430,900]) {
    frame.style.width = `${width}px`;
    await new Promise(resolve => win.requestAnimationFrame(resolve));
    const title = doc.querySelector("#catalog-title").getBoundingClientRect();
    const icon = info.getBoundingClientRect();
    assert(title.right <= icon.left, "Title overlaps info");
    assert(doc.documentElement.scrollWidth <= win.innerWidth, "Page overflows");
    assert(details.scrollWidth <= details.clientWidth, "Catalog option overflows");
    assert(details.querySelector('[role="combobox"]').getBoundingClientRect().height >= 48, "Picker touch target too small");
    results.push(`PASS Expanded option and title/info layout at ${width}px`);
  }
  frame.style.width = "390px";
  details.querySelector("summary").click();
  doc.querySelector("#catalog-close").click();
  assert(!doc.querySelector("#discard-changes").open, "Preview selection caused a discard confirmation");
  assert(doc.querySelector("#catalog-title").textContent === "Supermärkte", "Close did not return to markets");
  results.push("PASS Preview resets on reopening and does not interfere with close navigation");
  api.open();
  document.querySelector("#results").textContent = results.join("\n");
}
runTests().catch(error => {
  document.querySelector("#results").textContent = "FAIL " + error.stack;
  throw error;
});
</script>
