<!doctype html>
<html lang="de">
<meta charset="utf-8">
<title>Product suggestion regression tests</title>
<pre id="results">Running...</pre>
<iframe id="fixture" title="Vorschlagstests" style="width:390px;height:1000px;border:0"></iframe>
<script>
async function runTests() {
  const base = "../../custom_components/einkaufszettel/www/";
  const [markup, script] = await Promise.all([
    fetch(base + "app.html").then(response => response.text()),
    fetch(base + "app.js").then(response => response.text()),
  ]);
  const frame = document.querySelector("#fixture");
  frame.srcdoc = markup.replace(/<script src="[^"]+" defer><\/script>/, "")
    .replace("<head>", `<head><base href="${new URL(base, location.href)}">`);
  await new Promise(resolve => frame.onload = resolve);
  const win = frame.contentWindow, doc = win.document;
  const name = `suggestion-tests-${crypto.randomUUID()}`;
  const storage = new Map();
  const assert = (value, message) => { if (!value) throw Error(message); };
  const results = [];
  const pause = () => new Promise(resolve => setTimeout(resolve, 40));
  const source = script.replace(/initializeDesign\(\);\s*start\(\);\s*$/, "")
    .replace(/const STORAGE_NAME = "[^"]+";/, `const STORAGE_NAME = "${name}";`);
  const api = win.Function("localStorage", source + `
    return {
      async setup() {
        database = await openDatabase(); entryId = "a"; busy = false; authenticated = false;
        availableLists = [{entry_id:"a",name:"A"},{entry_id:"b",name:"B"}];
        categories = [{id:"food",name:"Lebensmittel"}];
        products = [
          {key:"butter",name:"Butter",category_id:"food",usage:{a:{added:5,last_added:100,weeks:{"2026-W42":2,"2026-W43":1}},b:{added:1,last_added:1,weeks:{}}}},
          {key:"bananen",name:"Bananen",category_id:null,usage:{a:{added:3,last_added:200,weeks:{}},b:{added:9,last_added:1,weeks:{}}}},
          {key:"bier",name:"Bier",category_id:null,usage:{a:{added:3,last_added:150,weeks:{}}}},
          ...Array.from({length:12},(_,i)=>({key:"brot "+i,name:"Brot "+i,category_id:null}))
        ];
        applyCatalog({supermarkets:[],categories,products});
        cacheCatalog(); updateModeView(); render();
      },
      queue:()=>readQueue(null),
      state:()=>({items:currentItems,products}),
      setItems:items=>{currentItems=items;render();},
      correctUsage:(key,count)=>{
        const product=products.find(product=>product.key===key);
        product.usage_adjustment=(product.usage_adjustment||0)+count-productUsageCount(product);
        cacheCatalog();
        renderCommonItems();
      },
      reloadCatalog:()=>{loadCachedSupermarkets();renderCommonItems();},
      pendingRanking:()=>{
        const original=pendingOperations;
        pendingOperations=[{type:"add_item",entry_id:"b",summary:"Brot 1",created_at:1000}];
        const ranked=commonItemsForCurrentList().map(({product,totalUsage})=>({key:product.key,totalUsage}));
        pendingOperations=original;
        return ranked;
      },
      switchList:()=>{entryId="b";currentItems=[];pendingOperations=[];render();},
      reload:async()=>{products=[];loadCachedSupermarkets();await loadSelectedList();},
      failNext:()=>{storeRequest=async()=>{throw Error("Test: Speicher voll");};},
      close:()=>database.close()
    };
  `)({getItem:key=>storage.get(key)||null,setItem:(key,value)=>storage.set(key,value),removeItem:key=>storage.delete(key)});
  try {
    await api.setup();
    const input = doc.querySelector("#new-item"), list = doc.querySelector("#product-suggestions");
    const commonItemsDialog = doc.querySelector("#common-items-dialog");
    doc.querySelector("#open-common-items").click();
    assert(commonItemsDialog.open, "Plus did not open the common-items dialog");
    assert(!commonItemsDialog.querySelector(".common-items-header p"), "Selection help text is still present");
    const choices = doc.querySelector("#common-items-list");
    const extraChoices = Array.from({length: 30}, () => choices.firstElementChild.cloneNode(true));
    choices.append(...extraChoices);
    for (const [width, height] of [[320,568],[390,844],[1024,768]]) {
      frame.style.width = width + "px"; frame.style.height = height + "px"; await pause();
      const bounds = commonItemsDialog.getBoundingClientRect();
      const header = doc.querySelector(".common-items-header").getBoundingClientRect();
      const footer = doc.querySelector(".common-items-footer").getBoundingClientRect();
      assert(bounds.x === 0 && bounds.y === 0 && bounds.width === win.innerWidth && bounds.height === win.innerHeight, "Article selection does not fill the viewport");
      assert(win.getComputedStyle(commonItemsDialog).borderRadius === "0px", "Fullscreen selection retains rounded corners");
      assert(choices.scrollHeight > choices.clientHeight, "Long article selection does not scroll");
      choices.scrollTop = choices.scrollHeight;
      assert(choices.scrollTop > 0 && header.top === doc.querySelector(".common-items-header").getBoundingClientRect().top && footer.bottom === doc.querySelector(".common-items-footer").getBoundingClientRect().bottom, "Scrolling moved the fixed header or footer");
      assert(footer.bottom <= bounds.bottom && doc.documentElement.scrollWidth <= win.innerWidth, "Selection actions overflow the viewport");
    }
    extraChoices.forEach(choice => choice.remove());
    choices.scrollTop = 0;
    frame.style.width = "390px"; frame.style.height = "1000px"; await pause();
    results.push("PASS Article selection is fullscreen without help text; long lists scroll independently of header and actions on mobile and desktop");
    assert(!commonItemsDialog.textContent.includes("Art der Liste"), "Unwanted list-type heading is visible");
    assert([...commonItemsDialog.querySelectorAll('[role="tab"]')].map(tab=>tab.textContent).join("|")==="Häufigste|Kürzlich|Regelmäßig","List types are missing or reordered");
    const frequentNames = () => [...doc.querySelectorAll("#common-items-list .common-item-name")].map(item=>item.textContent);
    assert(frequentNames().slice(0,3).join("|")==="Bananen|Butter|Bier","Most-frequent ranking must use overall totals");
    api.correctUsage("brot 0", 20);
    assert(frequentNames()[0]==="Brot 0", "Manually increased unused article is not first");
    assert(doc.querySelector("#common-items-list .common-item-frequency").textContent==="20×", "Corrected count not displayed");
    api.reloadCatalog();
    assert(frequentNames()[0]==="Brot 0", "Offline catalog reload lost corrected ranking");
    api.correctUsage("brot 0", 0);
    api.correctUsage("butter", 0);
    assert(frequentNames().slice(0,2).join("|")==="Bananen|Bier", "Lowered count did not change ranking");
    commonItemsDialog.querySelector('[data-common-items-type="regular"]').click();
    assert(frequentNames().join()==="Butter","Correction changed weekly ranking");
    commonItemsDialog.querySelector('[data-common-items-type="recent"]').click();
    assert(frequentNames()[0]==="Bananen","Correction changed recency ranking");
    api.correctUsage("butter", 6);
    commonItemsDialog.querySelector('[data-common-items-type="frequent"]').click();
    api.correctUsage("brot 1", 12);
    const pendingRanking = api.pendingRanking();
    assert(pendingRanking[0].key === "brot 1" && pendingRanking[0].totalUsage === 13,
      "Pending addition must count once on top of corrected overall total, including another list");
    api.correctUsage("brot 1", 0);
    results.push("PASS Frequent articles use corrected overall totals, including unused articles and offline reload; recent and regular stay unchanged");
    commonItemsDialog.querySelector('[data-common-items-type="recent"]').click();
    assert(doc.querySelector("#common-items-list .common-item-name").textContent==="Bananen","Recent ranking is wrong");
    commonItemsDialog.querySelector('[data-common-items-type="regular"]').click();
    assert([...doc.querySelectorAll("#common-items-list .common-item-name")].map(item=>item.textContent).join()==="Butter","Regular list did not use recurring weeks");
    doc.querySelector('#common-items-list input[aria-label="Butter"]').click();
    assert(doc.querySelector("#common-items-selection").textContent==="1 ausgewählt","Selection count did not update");
    doc.querySelector("#cancel-common-items").click();
    assert(!commonItemsDialog.open && (await api.queue()).length===0,"Cancel added selected articles");
    results.push("PASS Plus opens ranked checkbox lists with the selected underlined tabs and cancel preserves the list");
    function type(text) { input.focus(); input.value=text; input.dispatchEvent(new win.Event("input",{bubbles:true})); }
    const names = () => [...list.querySelectorAll(".product-suggestion-name")].map(option=>option.textContent);
    for (const mode of ["dark","light"]) {
      doc.body.dataset.colorMode=mode;
      doc.body.dataset.theme=mode==="light" ? "porcelain-blue" : "mono";
      for (const query of ["","b","no-match"]) {
        type(query);
        const backdrop=win.getComputedStyle(doc.body,"::before");
        assert(backdrop.content!=="none" && backdrop.backgroundColor==="rgba(0, 0, 0, 0.5)","Search background is not dimmed for "+mode+" / "+query);
        assert(Number(backdrop.zIndex)<Number(win.getComputedStyle(doc.querySelector("#add-form")).zIndex),"Search dock is covered by dimming");
        assert(backdrop.pointerEvents==="none","Dimming blocks existing pointer interactions");
      }
      input.blur();
      assert(win.getComputedStyle(doc.body,"::before").content==="none","Dimming remains after leaving search");
      type("b");
      doc.querySelector("#open-common-items").click();
      input.focus();
      assert(win.getComputedStyle(doc.body,"::before").content==="none","Dialog has an additional search backdrop");
      doc.querySelector("#cancel-common-items").click();
    }
    doc.body.dataset.colorMode="dark";doc.body.dataset.theme="mono";
    results.push("PASS Search background dims by 50% for empty input, matches and no matches in dark/light mode; dock stays above it, blur removes it and dialogs do not double-dim");
    const baseline = {};
    for (const kind of ["frequent", "recent", "regular"]) {
      doc.querySelector("#open-common-items").click();
      commonItemsDialog.querySelector('[data-common-items-type="'+kind+'"]').click();
      baseline[kind] = frequentNames().join("|");
      doc.querySelector("#cancel-common-items").click();
    }
    api.setItems([
      {uid:"existing-bier",summary:"Bier",status:"needs_action",metadata:{}},
      {uid:"completed-butter",summary:"Butter",status:"completed",metadata:{}},
      {uid:"other-catalog",summary:"Bananen",status:"needs_action",metadata:{catalog_id:"hardware"}},
    ]);
    type("b");
    assert(names()[0]==="Bier" && names()[1]==="Butter","Existing low-frequency search result is not at the top");
    assert(list.firstChild.disabled && list.firstChild.getAttribute("aria-disabled")==="true","Existing search result is selectable");
    assert(list.firstChild.querySelector(".on-list-badge").textContent==="Auf der Liste","Status badge missing");
    assert(list.firstChild.getBoundingClientRect().top < list.lastChild.getBoundingClientRect().top &&
      list.getBoundingClientRect().bottom <= input.getBoundingClientRect().top,
      "Existing search result is not farthest from the bottom input");
    input.dispatchEvent(new win.KeyboardEvent("keydown",{key:"ArrowDown",bubbles:true,cancelable:true}));
    assert(input.getAttribute("aria-activedescendant")===list.children[1].id,"Keyboard did not skip existing article");
    input.dispatchEvent(new win.KeyboardEvent("keydown",{key:"ArrowUp",bubbles:true,cancelable:true}));
    assert(input.getAttribute("aria-activedescendant")===list.lastChild.id,"Reverse keyboard navigation did not skip existing article");
    type("Bier");
    input.dispatchEvent(new win.KeyboardEvent("keydown",{key:"ArrowDown",bubbles:true,cancelable:true}));
    assert(!input.hasAttribute("aria-activedescendant"),"All-disabled results received keyboard selection");
    list.firstChild.click();
    assert((await api.queue()).length===0,"Existing result added a duplicate");
    for (const kind of ["frequent", "recent", "regular"]) {
      doc.querySelector("#open-common-items").click();
      commonItemsDialog.querySelector('[data-common-items-type="'+kind+'"]').click();
      assert(frequentNames().join("|")===baseline[kind],"Existing status changed "+kind+" ranking");
      if (kind!=="regular") {
        const existing=doc.querySelector(".common-item-option.already-on-list");
        assert(existing.querySelector("input").disabled && existing.querySelector(".on-list-mark"),"Existing quick choice is selectable or missing check");
        assert(existing.textContent.includes("Auf der Liste"),"Quick choice status missing");
      }
      doc.querySelector("#cancel-common-items").click();
    }
    doc.querySelector("#open-common-items").click();
    for (const width of [320,390,430]) {
      frame.style.width=width+"px";
      for (const mode of ["dark","light"]) {
        doc.body.dataset.colorMode=mode;
        doc.body.dataset.theme=mode==="light" ? "porcelain-blue" : "mono";
        await pause();
        const existing=doc.querySelector(".common-item-option.already-on-list");
        const badge=existing.querySelector(".on-list-badge").getBoundingClientRect();
        const row=existing.getBoundingClientRect();
        assert(badge.right<=row.right && badge.left>=row.left,"Existing status badge overflows at "+width+" in "+mode);
        assert(doc.documentElement.scrollWidth<=win.innerWidth,"Existing quick choices overflow at "+width);
      }
    }
    doc.body.dataset.colorMode="dark";doc.body.dataset.theme="mono";
    frame.style.width="390px";await pause();
    doc.querySelector('#common-items-list input[aria-label="Bananen"]').click();
    api.setItems([{uid:"incoming",summary:"Bananen",status:"needs_action",metadata:{}}]);
    assert(doc.querySelector("#add-common-items").disabled,"Live sync left an existing article selected");
    doc.querySelector("#cancel-common-items").click();
    api.setItems([]);
    results.push("PASS Existing search results stay at the top, cannot be added and are skipped by keyboard; quick-choice statistical positions stay unchanged; completed/other-catalog items remain available; live sync clears stale selections");
    type("B");
    assert(names().slice(0,3).join("|")==="Butter|Bananen|Bier","Frequency/recency ordering wrong");
    assert(list.children.length===15,"Matches were truncated instead of scrollable");
    assert(list.scrollHeight>list.clientHeight && list.clientHeight===440,"Exact ten-row scroll cap missing");
    assert(input.getAttribute("aria-expanded")==="true","Combobox expansion missing");
    results.push("PASS Prefix suggestions rank by list frequency and recency with ten-row scroll cap");
    type(" bU ");
    assert(names().join()==="Butter","Prefix filtering is not normalized");
    input.dispatchEvent(new win.KeyboardEvent("keydown",{key:"ArrowDown",bubbles:true,cancelable:true}));
    assert(input.getAttribute("aria-activedescendant")===list.firstChild.id,"Keyboard active option missing");
    input.dispatchEvent(new win.KeyboardEvent("keydown",{key:"Enter",bubbles:true,cancelable:true}));
    await pause();
    assert(api.state().items[0].summary==="Butter" && api.state().items[0].metadata.category_id==="food","Selection missing item/category");
    assert((await api.queue()).length===1,"Offline selection not durable");
    assert(input.value==="" && doc.activeElement===input && list.hidden,"Input/focus not ready for next item");
    results.push("PASS Keyboard selection immediately adds a durable offline article with category and retains input focus");
    type("b");
    assert(names()[0]==="Butter" && list.firstChild.disabled,"Already-open product missing or selectable");
    const option=[...list.children].find(option=>!option.disabled);
    option.dispatchEvent(new win.PointerEvent("pointerdown",{button:0,bubbles:true,cancelable:true}));
    option.click(); option.click();
    await pause();
    assert((await api.queue()).length===2,"Rapid double selection duplicated an article");
    results.push("PASS Pointer selection is immediate and duplicate taps do not add twice");
    type("no-match");
    assert(list.hidden,"No-match list should be hidden");
    doc.querySelector("#add-form").requestSubmit();
    await pause();
    assert(api.state().items.some(item=>item.summary==="no-match"),"Free input stopped working");
    type("b");
    input.dispatchEvent(new win.KeyboardEvent("keydown",{key:"Escape",bubbles:true}));
    assert(list.hidden,"Escape failed");
    type("b");
    input.dispatchEvent(new win.FocusEvent("blur"));
    assert(list.hidden,"Blur failed");
    results.push("PASS Free input, empty results, Escape and outside focus preserve existing behavior");
    await api.reload();
    assert(api.state().products.some(product=>product.key==="no-match"),"New offline name lost on replay");
    assert(api.state().items.some(item=>item.summary==="Butter"),"Offline queued selection lost on reload");
    api.switchList(); type("b");
    assert(names()[0]==="Bananen","Ranking not scoped to selected list");
    results.push("PASS Offline replay retains product names and per-list ranking");
    doc.querySelector("#mode-toggle").click();
    assert(list.hidden && doc.querySelector("#add-form").hidden,"Suggestions remain in shopping mode");
    doc.querySelector("#mode-toggle").click(); type("b");
    for (const width of [320,390,700]) {
      frame.style.width=width+"px"; await pause();
      assert(doc.documentElement.scrollWidth<=doc.documentElement.clientWidth,"Horizontal overflow");
      assert(list.getBoundingClientRect().right<=doc.documentElement.clientWidth,"Suggestion popup overflows");
    }
    results.push("PASS Mode switch hides suggestions; popup fits 320/390/700px");
    const plus = doc.querySelector("#open-common-items");
    plus.click();
    doc.querySelector('#common-items-list input[aria-label="Bananen"]').click();
    const addSelected = doc.querySelector("#add-common-items");
    assert(!addSelected.disabled && addSelected.textContent==="Auf die Liste (1)","Add button did not enable for a selection");
    addSelected.click();
    await pause();
    assert(api.state().items.some(item=>item.summary==="Bananen"),"Selected article was not added to the list");
    assert(input.value==="b","Opening and confirming the list lost the typed input");
    results.push("PASS Selected articles are added offline and the typed draft remains intact");
    api.failNext(); type("Neue Sache");
    doc.querySelector("#add-form").requestSubmit(); await pause();
    assert(input.value==="Neue Sache","Failed persistence lost typed input");
    assert(doc.querySelector("#message").textContent.includes("Speicher voll"),"Persistence failure hidden");
    results.push("PASS Failed local persistence restores the input and shows an explicit error");
  } finally {
    api.close(); win.indexedDB.deleteDatabase(name);
  }
  document.querySelector("#results").textContent=results.join("\n");
}
runTests().catch(error=>{document.querySelector("#results").textContent="FAIL "+error.stack;});
</script>
</html>
