<!doctype html>
<html lang="de">
<meta charset="utf-8">
<title>Artikel verschieben · Dialog- und Gestentests</title>
<pre id="results">Running...</pre>
<iframe id="fixture" title="Verschieben-Dialog" style="width:390px;height:844px;border:0"></iframe>
<script>
async function runTests() {
  const base = "../../custom_components/einkaufszettel/www/";
  const [markup, script] = await Promise.all(["app.html", "app.js"].map(file =>
    fetch(base + file, {cache:"no-store"}).then(response => response.text())));
  const frame = document.querySelector("#fixture");
  frame.srcdoc = markup.replace(/<script src="[^"]+" defer><\/script>/, "")
    .replace("<head>", `<head><base href="${new URL(base, location.href)}">`);
  await new Promise(resolve => frame.onload = resolve);
  const win = frame.contentWindow, doc = win.document, operations = [], results = [];
  const nativeCapture = {
    setPointerCapture: win.Element.prototype.setPointerCapture,
    hasPointerCapture: win.Element.prototype.hasPointerCapture,
  };
  win.Element.prototype.setPointerCapture = () => {};
  win.Element.prototype.hasPointerCapture = () => false;
  const storage = new Map();
  let storageBlocked = false;
  const assert = (value, message) => { if (!value) throw Error(message); };
  const waitFor = async predicate => {
    const deadline = performance.now() + 2000;
    while (!predicate()) {
      if (performance.now() > deadline) throw Error("Timed out waiting for dialog action");
      await new Promise(resolve => setTimeout(resolve, 10));
    }
  };
  const api = win.Function("test", "localStorage",
    script.replace(/initializeDesign\(\);\s*start\(\);\s*$/, "") + `
      entryId = "a"; busy = false; authenticated = false;
      categories = []; supermarkets = []; products = [];
      availableLists = [{entry_id:"a",name:"ALDI"},{entry_id:"b",name:"REWE"},{entry_id:"c",name:"dm"}];
      elements.listName.textContent = "ALDI";
      readCachedLists = async () => [{entry_id:"b",items:[{status:"needs_action"},{status:"completed"}]}];
      enqueue = async (operation, listId) => {test.operations.push({...operation,entry_id:listId});};
      currentItems = [{uid:"one",summary:"Tomaten",status:"needs_action",
        metadata:{quantity:"2 Stück",catalog_id:"supermarket",image:"data:image/png;base64,test"},description:"reif",due:"2026-11-03"}];
      render();
      return {openMoveItem, setLists: lists => {availableLists=lists;}, render,
        setSource: id => {entryId=id;},
        setBusy: value => {busy=value;}, setTheme: applyDesign,
        removeItem: () => {currentItems=[];}, resetItem: () => {
          currentItems=[{uid:"one",summary:"Tomaten",status:"needs_action",metadata:{quantity:"2 Stück"}}];render();
        }};
    `)({operations}, {
      getItem: key => storage.get(key) ?? null,
      setItem(key, value) { if (storageBlocked) throw Error("Storage blocked"); storage.set(key, value); },
      removeItem: key => storage.delete(key),
    });
  const dialog = doc.querySelector("#move-item"), confirm = doc.querySelector("#confirm-move-item");
  assert(win.getComputedStyle(dialog).display === "none", "Closed dialog is visible");
  assert(win.getComputedStyle(dialog).position === "fixed" &&
    win.getComputedStyle(dialog).inset === "0px", "Dialog positioning changes when entering the modal layer");
  const swipe = (dx,dy=0,cancel=false) => {
    const row = doc.querySelector(".item");
    row.dispatchEvent(new win.PointerEvent("pointerdown", {pointerId:7,button:0,clientX:140,clientY:100,bubbles:true}));
    row.dispatchEvent(new win.PointerEvent("pointermove", {pointerId:7,clientX:140+dx,clientY:100+dy,bubbles:true,cancelable:true}));
    row.dispatchEvent(new win.PointerEvent(cancel?"pointercancel":"pointerup", {pointerId:7,clientX:140+dx,clientY:100+dy,bubbles:true}));
  };
  swipe(100);
  await waitFor(() => dialog.open);
  assert(doc.querySelector("#move-item-title").textContent === "Auf andere Liste verschieben", "Wrong dialog title");
  assert(doc.querySelectorAll(".move-item-option").length === 2, "Current list offered as destination");
  assert(confirm.disabled, "Move enabled without a destination");
  assert(doc.querySelector("#move-item-description").textContent.includes("Tomaten · 2 Stück"), "Missing article context");
  assert(doc.querySelector(".move-item-option small").textContent.startsWith("1 offener Artikel"), "Count includes completed items");
  const actions = doc.querySelector("#move-item .dialog-actions").getBoundingClientRect();
  const cancel = doc.querySelector("#cancel-move-item").getBoundingClientRect();
  const move = confirm.getBoundingClientRect();
  assert(Math.abs(cancel.left-actions.left)<1 && Math.abs(move.right-actions.right)<1, "Buttons are not aligned left/right");
  doc.querySelector('input[value="b"][name="move-target"]').click();
  doc.querySelector('input[value="c"][name="move-target"]').click();
  assert(doc.querySelectorAll('#move-item input:checked').length === 1, "Multiple targets selected");
  doc.querySelector('input[value="b"][name="move-target"]').click();
  doc.querySelector("#move-item-form").requestSubmit();
  await waitFor(() => !dialog.open);
  assert(operations.length === 1 && operations[0].type === "move_item", "Move not queued");
  const operation = operations[0];
  assert(operation.entry_id === "a" && operation.target_entry_id === "b" && operation.uid === "one" &&
    operation.target_uid !== operation.uid, "Invalid source/target identity");
  assert(operation.metadata.quantity === "2 Stück" && operation.metadata.image && operation.description === "reif" &&
    operation.due === "2026-11-03", "Move lost article details");
  results.push("PASS Right swipe opens variant 2; exclusive targets, fields and left/right buttons");

  for (const closeId of ["close-move-item", "cancel-move-item"]) {
    await api.openMoveItem("one");
    assert(confirm.disabled && !doc.querySelector("#move-item input:checked"), "Previous selection retained");
    doc.querySelector("#"+closeId).click();
    await waitFor(() => !dialog.open);
  }
  assert(operations.length === 1, "Cancel queued changes");
  results.push("PASS Close and cancel leave article unchanged; selection resets");

  for (const [dx,dy,cancelled] of [[40,0,false],[100,130,false],[100,0,true]]) {
    swipe(dx,dy,cancelled);
    await new Promise(resolve => setTimeout(resolve,25));
    assert(!dialog.open && operations.length === 1, "Short/vertical/cancelled gesture changed article");
    assert(doc.querySelector(".item").style.transform === "", "Gesture left a transformed row");
  }
  api.setBusy(true);
  swipe(100);
  assert(!dialog.open, "Busy app opened move dialog");
  api.setBusy(false);
  results.push("PASS Swipe thresholds, scrolling, pointer cancellation and busy guard");

  doc.querySelector('[aria-label="Bearbeiten: Tomaten"]').dispatchEvent(new win.KeyboardEvent("keydown",{key:"ArrowRight",altKey:true,bubbles:true}));
  await waitFor(() => dialog.open);
  doc.querySelector("#cancel-move-item").click();
  await waitFor(() => !dialog.open);
  await api.openMoveItem("one");
  doc.querySelector("#close-move-item").dispatchEvent(new win.KeyboardEvent("keydown",{key:"Escape",bubbles:true}));
  await waitFor(() => !dialog.open);
  assert(operations.length === 1, "Escape queued a change");
  results.push("PASS Alt+ArrowRight opens the dialog; Escape cancels without changes");

  await api.openMoveItem("one");
  api.removeItem();
  doc.querySelector('#move-item input[value="b"]').click();
  doc.querySelector("#move-item-form").requestSubmit();
  assert(dialog.open && operations.length === 1 && doc.querySelector("#move-item-message").textContent, "Stale article was moved");
  doc.querySelector("#close-move-item").click();
  await waitFor(() => !dialog.open);
  api.resetItem();
  api.setLists([{entry_id:"a",name:"ALDI"}]);
  await api.openMoveItem("one");
  assert(confirm.disabled && doc.querySelector("#move-item-message").textContent.includes("Keine andere Liste"), "Missing empty state");
  doc.querySelector("#cancel-move-item").click();
  await waitFor(() => !dialog.open);
  results.push("PASS Missing target and stale item show errors without changes");

  swipe(-100);
  await waitFor(() => operations.length === 2);
  assert(operations[1].type === "delete_item" && !dialog.open, "Left swipe no longer deletes");
  results.push("PASS Left swipe still queues deletion");
  api.render();
  const sortingLists = [{entry_id:"a",name:"ALDI"},{entry_id:"b",name:"REWE"},
    {entry_id:"c",name:"dm"},{entry_id:"d",name:"Wochenmarkt"}];
  api.setLists(sortingLists);
  const listOrder = () => [...doc.querySelectorAll(".move-item-option input")].map(input => input.value).join(",");
  const assertPreview = (row, x, y, offsetX, offsetY) => {
    const ghost = doc.querySelector(".move-item-drag-ghost");
    assert(ghost && ghost.parentElement === dialog && ghost.inert && ghost.getAttribute("aria-hidden") === "true",
      "Drag preview is missing from the modal layer or is accessible");
    const rect = ghost.getBoundingClientRect(), original = row.getBoundingClientRect();
    assert(Math.abs(rect.left - (x-offsetX)) < 1 && Math.abs(rect.top - (y-offsetY)) < 1,
      "Drag preview does not follow the pointer at its grab offset");
    assert(Math.abs(rect.width-original.width) < 1 && Math.abs(rect.height-original.height) < 1,
      "Drag preview changed the card dimensions");
    assert(row.classList.contains("dragging") && win.getComputedStyle(row).opacity === "0.25",
      "Insertion placeholder is not visible");
    assert(win.getComputedStyle(ghost).pointerEvents === "none" && !ghost.querySelector("input").name &&
      ghost.querySelector("input").disabled, "Preview intercepts gestures or participates in target selection");
  };
  const assertNoPreview = () => assert(!doc.querySelector(".move-item-drag-ghost,.move-item-option.dragging,#move-item-options.sorting"),
    "Drag preview or placeholder leaked after finishing");
  const closeDialog = async () => {
    const closed = new Promise(resolve => dialog.addEventListener("close", resolve, {once:true}));
    doc.querySelector("#cancel-move-item").click();
    await closed;
    assertNoPreview();
  };
  const pointer = (type, row, x, y) => row.dispatchEvent(new win.PointerEvent(type, {
    pointerId:41,pointerType:"mouse",button:0,clientX:x,clientY:y,bubbles:true,cancelable:true,isPrimary:true,
  }));
  const startDrag = async (id, hold=true) => {
    const row = doc.querySelector(`.move-item-option:has(input[value="${id}"])`);
    const rect = row.getBoundingClientRect();
    const x = rect.left + rect.width / 2, y = rect.top + rect.height / 2;
    pointer("pointerdown",row,x,y);
    if (hold) await new Promise(resolve => setTimeout(resolve,550));
    if (hold) assertPreview(row,x,y,rect.width/2,rect.height/2);
    else assertNoPreview();
    return {row,x,y};
  };
  const dragToTop = drag => {
    const rect = drag.row.getBoundingClientRect();
    const y = doc.querySelector(".move-item-option").getBoundingClientRect().top+2;
    pointer("pointermove",drag.row,drag.x,y);
    if (doc.querySelector(".move-item-drag-ghost")) assertPreview(drag.row,drag.x,y,rect.width/2,rect.height/2);
  };
  await api.openMoveItem("one");
  assert(listOrder() === "b,c,d", "Initial target order changed");
  let drag = await startDrag("d",false);
  dragToTop(drag);
  pointer("pointerup",drag.row,drag.x,drag.y);
  assert(listOrder() === "b,c,d", "Movement before long press reordered lists");
  drag = await startDrag("d");
  dragToTop(drag);
  assert(listOrder() === "d,b,c", "Long press did not enable sorting");
  pointer("pointerup",drag.row,drag.x,drag.y);
  assertNoPreview();
  drag.row.click();
  assert(confirm.disabled && !doc.querySelector("#move-item input:checked"), "Dragging selected a target");
  assert(JSON.parse(storage.get("einkaufszettel.move_list_order.a")).join(",") === "d,b,c", "Order not saved on drop");
  await closeDialog();
  await api.openMoveItem("one");
  assert(listOrder() === "d,b,c", "Reopening did not restore order");
  assert(!doc.querySelector(".move-item-option button,.move-item-option svg,.move-grip"), "Sorting added visual controls");
  results.push("PASS Long press sorts without controls or selection; dropping saves the default");

  drag = await startDrag("c");
  dragToTop(drag);
  pointer("pointercancel",drag.row,drag.x,drag.y);
  assertNoPreview();
  assert(listOrder() === "d,b,c", "Pointer cancellation did not roll back order");
  drag = await startDrag("c");
  dragToTop(drag);
  doc.querySelector("#close-move-item").dispatchEvent(new win.KeyboardEvent("keydown",{key:"Escape",bubbles:true,cancelable:true}));
  assertNoPreview();
  assert(dialog.open && listOrder() === "d,b,c", "Escape should cancel sorting, not close the dialog");
  assert(JSON.parse(storage.get("einkaufszettel.move_list_order.a")).join(",") === "d,b,c", "Cancelled order was saved");
  await closeDialog();
  results.push("PASS Pointer cancellation and Escape restore the previous order");

  api.setSource("b");
  await api.openMoveItem("one");
  assert(listOrder() === "a,c,d", "Order leaked into another source list");
  drag = await startDrag("d");
  dragToTop(drag);
  pointer("pointerup",drag.row,drag.x,drag.y);
  await closeDialog();
  api.setSource("a");
  api.setLists([...sortingLists,{entry_id:"e",name:"Neue Liste"}].filter(list=>list.entry_id!=="b"));
  await api.openMoveItem("one");
  assert(listOrder() === "d,c,e", "Unavailable targets or new list changed saved order");
  await closeDialog();
  api.setLists(sortingLists);
  await api.openMoveItem("one");
  assert(listOrder() === "d,b,c", "Returning target lost its order");
  await closeDialog();
  results.push("PASS Orders are source-specific; missing targets are skipped and new targets appended");

  await api.openMoveItem("one");
  storageBlocked = true;
  drag = await startDrag("c");
  dragToTop(drag);
  pointer("pointerup",drag.row,drag.x,drag.y);
  assert(listOrder() === "d,b,c", "Failed save did not roll back");
  assert(doc.querySelector("#move-item-message").textContent.includes("nicht gespeichert"), "Save failure not visible");
  storageBlocked = false;
  await closeDialog();
  storage.set("einkaufszettel.move_list_order.a",'["b","b"]');
  await api.openMoveItem("one");
  assert(listOrder() === "b,c,d" && doc.querySelector("#move-item-message").textContent.includes("nicht geladen"), "Corrupt order silently accepted");
  await closeDialog();
  storage.set("einkaufszettel.move_list_order.a",'["d","b","c"]');
  results.push("PASS Storage failures are explicit and unsaved reorders are rolled back");

  await api.openMoveItem("one");
  doc.querySelector('#move-item input[value="c"]').dispatchEvent(new win.KeyboardEvent("keydown", {
    key:"ArrowUp",altKey:true,bubbles:true,cancelable:true,
  }));
  assert(listOrder() === "d,c,b", "Keyboard sorting failed");
  await closeDialog();
  await api.openMoveItem("one");
  assert(listOrder() === "d,c,b", "Keyboard order not persisted");
  const touchRow = doc.querySelector('.move-item-option:has(input[value="b"])');
  const rect = touchRow.getBoundingClientRect();
  const touchEvent = (type,y) => {
    const touch = new win.Touch({identifier:52,target:touchRow,clientX:rect.left+30,clientY:y});
    return touchRow.dispatchEvent(new win.TouchEvent(type,{
      bubbles:true,cancelable:true,changedTouches:[touch],touches:type==="touchend"?[]:[touch],
    }));
  };
  touchEvent("touchstart",rect.top+30);
  await new Promise(resolve => setTimeout(resolve,550));
  assertPreview(touchRow,rect.left+30,rect.top+30,30,30);
  const touchY = doc.querySelector(".move-item-option").getBoundingClientRect().top+2;
  assert(!touchEvent("touchmove",touchY), "Active touch drag allowed scrolling");
  assertPreview(touchRow,rect.left+30,touchY,30,30);
  touchRow.dispatchEvent(new win.PointerEvent("lostpointercapture", {
    pointerId:52,pointerType:"touch",bubbles:true,
  }));
  assert(listOrder() === "b,d,c", "Implicit touch capture loss cancelled the active touch drag");
  touchEvent("touchend",rect.top+30);
  assertNoPreview();
  assert(listOrder() === "b,d,c", "Touch long press did not reorder");
  await closeDialog();
  assert(operations.length === 2, "Sorting queued an article operation");
  results.push("PASS Keyboard and touch sorting persist without moving the article");
  await api.openMoveItem("one");
  doc.querySelector('#move-item input[value="d"]').click();
  drag = await startDrag("d");
  assert(doc.querySelector('#move-item-options input[value="d"]').checked, "Preview cleared the selected target");
  dragToTop(drag);
  win.dispatchEvent(new win.Event("blur"));
  assertNoPreview();
  assert(listOrder() === "b,d,c" && doc.querySelector('#move-item-options input[value="d"]').checked,
    "Blur failed to restore order or changed the target selection");
  drag = await startDrag("c");
  dragToTop(drag);
  await closeDialog();
  await api.openMoveItem("one");
  assert(listOrder() === "b,d,c", "Closing during a drag saved the temporary order");
  await closeDialog();
  results.push("PASS Live mouse/touch preview and placeholder follow the grab point; drop, cancel, blur and close clean up without changing selection");

  api.setLists([{entry_id:"a",name:"ALDI"},
    ...Array.from({length:18},(_,i)=>({entry_id:"target-"+i,name:"Sehr langer Name einer Einkaufsliste "+i}))]);
  await api.openMoveItem("one");
  const options = doc.querySelector("#move-item-options");
  assert(options.scrollHeight > options.clientHeight, "Long target list does not scroll internally");
  assert(dialog.scrollWidth === dialog.clientWidth, "Long list names overflow horizontally");
  drag = await startDrag("target-0");
  pointer("pointermove",drag.row,drag.x,options.getBoundingClientRect().bottom-2);
  await new Promise(resolve => setTimeout(resolve,250));
  assert(options.scrollTop > 20, "Dragging near the edge did not scroll the list");
  const scrollingRow = drag.row.getBoundingClientRect();
  assertPreview(drag.row,drag.x,options.getBoundingClientRect().bottom-2,scrollingRow.width/2,scrollingRow.height/2);
  pointer("pointercancel",drag.row,drag.x,drag.y);
  assert(listOrder().startsWith("target-0,target-1"), "Cancelling auto-scroll drag changed the default");
  await closeDialog();
  results.push("PASS Long target lists scroll internally and long names wrap");
  const nextFrame = () => new Promise(resolve => win.requestAnimationFrame(resolve));
  for (const theme of ["mono", "porcelain-blue"]) {
    api.setTheme(theme);
    for (const [width, height] of [[320,568],[390,844],[1024,768]]) {
      frame.style.width = width + "px";
      frame.style.height = height + "px";
      await nextFrame();
      await api.openMoveItem("one");
      const initial = dialog.getBoundingClientRect();
      const assertCentered = () => {
        const rect = dialog.getBoundingClientRect();
        assert(Math.abs(rect.left + rect.width / 2 - win.innerWidth / 2) <= 1 &&
          Math.abs(rect.top + rect.height / 2 - win.innerHeight / 2) <= 1,
          `Dialog is not centered at ${width}x${height} (${theme})`);
        assert(Math.abs(rect.left - initial.left) <= 1 && Math.abs(rect.top - initial.top) <= 1,
          "Dialog jumps after opening");
        assert(rect.top >= 0 && rect.bottom <= win.innerHeight && rect.left >= 0 && rect.right <= win.innerWidth,
          "Dialog extends beyond the viewport");
      };
      assertCentered();
      for (let sample = 0; sample < 3; sample++) {
        await nextFrame();
        assertCentered();
      }
      assert(doc.activeElement.id === "close-move-item", "Opening focus changed");
      const previewDrag = await startDrag("target-0");
      assert(win.getComputedStyle(doc.querySelector(".move-item-drag-ghost")).backgroundColor ===
        win.getComputedStyle(previewDrag.row).backgroundColor, "Preview does not use the active theme");
      await closeDialog();
      assert(win.getComputedStyle(dialog).display === "none", "Closing left a visible dialog");
    }
  }
  frame.style.width = "390px";
  frame.style.height = "844px";
  api.setTheme("mono");
  results.push("PASS Dialog opens centered without frame-to-frame jumps at phone and desktop sizes in both themes");
  api.setLists([{entry_id:"a",name:"ALDI"},{entry_id:"b",name:"REWE"},
    {entry_id:"c",name:"dm"},{entry_id:"d",name:"Wochenmarkt"},{entry_id:"e",name:"Baumarkt"}]);
  await api.openMoveItem("one");
  doc.querySelector('#move-item input[value="b"]').click();
  Object.assign(win.Element.prototype, nativeCapture);
  document.querySelector("#results").textContent = results.join("\n");
  document.body.dataset.result = "passed";
}
runTests().catch(error => {
  document.querySelector("#results").textContent = `FAIL ${error.stack}`;
  document.body.dataset.result = "failed";
});
</script>
</html>
