<!doctype html>
<html lang="de">
<meta charset="utf-8">
<title>Product management regression tests</title>
<pre id="results">Running...</pre>
<iframe id="fixture" title="Testoberfläche" style="width:390px;height:844px;border:0"></iframe>
<script>
async function runTests() {
  const base = "../../custom_components/einkaufszettel/www/";
  const [markup, script] = await Promise.all([
    fetch(base + "app.html").then(response => response.text()),
    fetch(base + "app.js").then(response => response.text()),
  ]);
  const frame = document.querySelector("#fixture");
  frame.srcdoc = markup.replace(/<script src="[^"]+" defer><\/script>/, "")
    .replace("<head>", `<head><base href="${new URL(base, location.href)}">`);
  await new Promise(resolve => frame.onload = resolve);
  const win = frame.contentWindow, doc = win.document;
  const source = { key: "eier", name: "Eier", usage: {test: {added: 32, weeks: {}}} };
  const target = { key: "bier", name: "Bier", usage: {test: {added: 18, weeks: {}}} };
  const calls = [], results = [];
  const api = win.Function("calls", script.replace(/initializeDesign\(\);\s*start\(\);\s*$/, "") + `
    const originalOpenCatalog = openCatalog;
    const originalRenderCatalogPage = renderCatalogPage;
    openCatalog = (view, product) => {
      catalogDraft = {...product};
      calls.push({view, key: product.key});
    };
    renderCatalogPage = () => {};
    saveCatalog = (...args) => calls.push({save: args});
    let deletionInfo = {
      product: {key: "eier", name: "Eier", usage: {test: {added: 32, last_added: 1, weeks: {}}}},
      lists: [{entry_id: "weekly", name: "Wocheneinkauf"}, {entry_id: "drugstore", name: "Drogerie"}],
    };
    sendCommand = async command => {
      if (!command.endsWith("/get_product_delete_info")) throw Error("Unexpected command");
      if (!deletionInfo) throw Error("Listenprüfung fehlgeschlagen");
      return deletionInfo;
    };
    return {
      productManagementRow, draft: () => catalogDraft,
      setDeletionInfo(value) { deletionInfo = value; },
      setupManagementList(view, length) {
        openCatalog = originalOpenCatalog;
        renderCatalogPage = originalRenderCatalogPage;
        const records = Array.from({length}, (_, index) => ({
          id: "record-" + index, name: "Eintrag " + String(index).padStart(2, "0")
        }));
        if (view === "markets") supermarkets = records;
        else categories = records;
        busy = false;
        openCatalog(view);
      },
      setupCatalog() {
        openCatalog = originalOpenCatalog;
        renderCatalogPage = originalRenderCatalogPage;
        products = Array.from({length: 60}, (_, index) => ({
          key: "artikel-" + index, name: "Artikel " + String(index).padStart(2, "0"), usage: {}
        }));
        busy = false;
        openCatalog("products");
      },
      setupMerge(source, target) {
        openCatalog = originalOpenCatalog;
        renderCatalogPage = originalRenderCatalogPage;
        products = [source, target];
        busy = false;
        openCatalog("product-merge", {...source, target_key: ""});
      },
      setupStatistics(product) {
        openCatalog = originalOpenCatalog;
        renderCatalogPage = originalRenderCatalogPage;
        products = [product];
        busy = false;
        openCatalog("product-statistics", product);
      },
      setupView(view, creating = false) {
        openCatalog = originalOpenCatalog;
        renderCatalogPage = originalRenderCatalogPage;
        busy = false;
        catalogDirty = false;
        products = [
          {key: "buter", name: "Buter", usage: {}},
          {key: "butter", name: "Butter", usage: {}}
        ];
        categories = [{id: "dairy", name: "Milchprodukte"}];
        openCatalog(view, view.startsWith("category") ? categories[0]
          : creating ? {key: "", name: ""} : products[0]);
      },
      setupCategoryDelete() {
        openCatalog = originalOpenCatalog;
        renderCatalogPage = originalRenderCatalogPage;
        categories = [{id: "backwaren", name: "Backwaren"}];
        supermarkets = [];
        busy = false;
        openCatalog("category-edit", categories[0]);
      },
      view: () => catalogView
    };
  `)(calls);
  const assert = (condition, message) => { if (!condition) throw Error(message); };
  function test(name, action) { action(); results.push("PASS " + name); }
  const row = api.productManagementRow(source, target);
  doc.querySelector(".app").replaceChildren(row);
  test("Comparison rename uses a dark button beside the saved name with decorative icons", () => {
    const rename = row.querySelector(".product-management-heading .product-rename");
    assert(row.querySelector(".product-management-usage").textContent === "32 Verwendungen", "Usage count changed");
    assert(rename.classList.contains("secondary") && !rename.classList.contains("primary"), "Comparison must use the secondary style");
    assert(rename.getAttribute("aria-label") === "Eier umbenennen", "Accessible name missing");
    assert(rename.querySelectorAll('[aria-hidden="true"]').length === 2, "Pencil or arrow missing");
    assert(win.getComputedStyle(rename).minHeight === "44px", "Touch target too small");
    rename.click();
    assert(calls.at(-1).view === "product-edit", "Rename action changed");
  });
  test("Comparison shows both article names and only one merge action", () => {
    const names = [...row.querySelectorAll(".product-similar-target strong")].map(el => el.textContent);
    assert(names.join("|") === "Eier|Bier", "Comparison names incorrect");
    assert([...row.querySelectorAll("button")].filter(el => el.textContent.includes("Zusammenführen")).length === 1, "Duplicate merge action");
    const actions = row.querySelector(".product-similar-actions");
    assert(actions.firstElementChild.textContent === "Kein Fehler", "Keep action must come first");
    actions.lastElementChild.click();
    assert(calls.at(-1).view === "product-merge", "Merge action changed");
    assert(api.draft().target_key === "bier", "Suggested target not selected");
    assert(!row.querySelector(".primary"), "Comparison must not contain bright primary actions");
    const originalTheme = doc.body.dataset.theme;
    const reference = doc.createElement("span");
    reference.style.background = "var(--surface)";
    row.append(reference);
    for (const theme of ["mono", "botanical", "midnight-plum", "market-journal", "fresh-signal", "tomato", "lime-focus", "indigo-pocket"]) {
      doc.body.dataset.theme = theme;
      for (const button of row.querySelectorAll("button:not(.danger-button)")) {
        assert(win.getComputedStyle(button).backgroundColor === win.getComputedStyle(reference).backgroundColor,
          "Comparison action must use the dark surface in " + theme);
      }
    }
    doc.body.dataset.theme = originalTheme;
    reference.remove();
  });
  test("Kein Fehler keeps its persistent pair dismissal", () => {
    row.querySelector(".product-similar-dismiss").click();
    const [command, payload, view] = calls.at(-1).save;
    assert(command === "dismiss_product_suggestion", "Wrong command");
    assert(payload.product_key === "eier" && payload.similar_key === "bier", "Wrong pair");
    assert(view === "products", "Wrong return view");
  });
  test("Manual merging and deletion remain available without a suggestion", () => {
    const plain = api.productManagementRow(source, null);
    doc.querySelector(".app").append(plain);
    const buttons = plain.querySelector(".product-management-buttons");
    assert(!plain.querySelector(".product-management-heading button"), "Rename must be below the name");
    assert(buttons.children.length === 4, "Four actions required");
    for (const button of buttons.children) {
      assert(button.classList.contains("secondary"), "Standard secondary style missing");
      if (button.classList.contains("product-outline-action")) {
        const icon = button.querySelector("svg.chevron[aria-hidden='true']");
        assert(icon && icon.querySelector("path"), "Shared SVG chevron missing");
        const iconRect = icon.getBoundingClientRect(), buttonRect = button.getBoundingClientRect();
        assert(Math.abs(iconRect.top + iconRect.height / 2 - buttonRect.top - buttonRect.height / 2) < 1, "Chevron is not vertically centered");
      }
      assert(win.getComputedStyle(button).minHeight === "44px", "Touch target too small");
    }
    const originalTheme = doc.body.dataset.theme;
    const reference = doc.createElement("button");
    reference.className = "primary";
    reference.style.border = "1px solid var(--line)";
    plain.append(reference);
    for (const theme of ["mono", "botanical", "midnight-plum", "market-journal", "fresh-signal", "tomato", "lime-focus", "indigo-pocket"]) {
      doc.body.dataset.theme = theme;
      const referenceStyle = win.getComputedStyle(reference);
      for (const button of buttons.querySelectorAll(".product-outline-action")) {
        const style = win.getComputedStyle(button);
        assert(style.borderTopWidth === "1px" && style.borderTopStyle === "solid" &&
          style.borderTopColor === referenceStyle.borderTopColor, `Action border differs from app border in ${theme}`);
        assert(style.backgroundColor === referenceStyle.backgroundColor, `Action must use the accent background in ${theme}`);
        assert(style.color === referenceStyle.color, `Action must use accent text in ${theme}`);
      }
    }
    doc.body.dataset.theme = originalTheme;
    reference.remove();
    buttons.children[2].click();
    assert(calls.at(-1).view === "product-statistics", "Statistics action missing");
    buttons.firstElementChild.click();
    assert(calls.at(-1).view === "product-edit", "Plain rename action changed");
    assert(buttons.children[1].textContent === "Zusammenführen", "Manual merge missing");
    assert(buttons.lastElementChild.textContent === "Löschen", "Delete action missing");
    assert(!buttons.lastElementChild.disabled, "Used product deletion must be enabled");
    assert(win.getComputedStyle(buttons.lastElementChild).color === "rgb(255, 180, 168)", "Delete must remain red");
    buttons.children[1].click();
    assert(calls.at(-1).view === "product-merge", "Manual merge action changed");
    const unused = api.productManagementRow({...source, usage: {}}, null);
    assert(!unused.querySelector(".danger-button").disabled, "Unused product deletion must remain enabled");
    assert(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth, "Plain row overflows on mobile");
    plain.remove();
  });
  test("Long article names wrap without horizontal overflow on mobile", () => {
    const long = api.productManagementRow({...source, name: "SehrlangerArtikelnameOhneLeerzeichen".repeat(3)}, target);
    row.replaceWith(long);
    assert(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth, "Horizontal overflow");
    long.replaceWith(api.productManagementRow(source, null));
  });
  api.setupStatistics({...source, usage_adjustment: -20});
  test("Statistics editor corrects the overall count and validates whole nonnegative values", () => {
    const input = doc.querySelector("#product-usage-count");
    assert(input.value === "12", "Corrected total missing");
    input.value = "-1";
    assert(!input.checkValidity(), "Negative count accepted");
    input.value = "1.5";
    assert(!input.checkValidity(), "Fraction accepted");
    input.value = "0";
    input.dispatchEvent(new win.Event("input"));
    input.form.requestSubmit();
    const [command, payload] = calls.at(-1).save;
    assert(command === "set_product_statistics" && payload.count === 0 && payload.product_key === "eier", "Statistics save payload incorrect");
    doc.querySelector("#catalog-fixed-actions button").click();
    doc.querySelector('#discard-changes button[value="discard"]').click();
  });
  api.setupCatalog();
  const page = doc.querySelector("#catalog-page");
  const content = doc.querySelector("#catalog-content");
  const footer = doc.querySelector("#catalog-fixed-actions");
  const footerPosition = footer.getBoundingClientRect();
  test("Management help stays compact until its accessible help button is opened", () => {
    const trigger = doc.querySelector("#catalog-page .management-help-trigger");
    const popover = doc.querySelector("#catalog-help-popover");
    assert(!trigger.hidden && popover.hidden, "Help should start collapsed");
    assert(doc.querySelector("#catalog-help").hidden, "Long help text still consumes space");
    trigger.click();
    assert(!popover.hidden && trigger.getAttribute("aria-expanded") === "true", "Help did not open accessibly");
    assert(popover.textContent.includes("Suchvorschläge"), "Contextual help text missing");
    doc.dispatchEvent(new win.KeyboardEvent("keydown", {key: "Escape", bubbles: true}));
    assert(popover.hidden && doc.activeElement === trigger, "Escape did not close help and restore focus");
    trigger.click();
    doc.querySelector("#catalog-title").dispatchEvent(new win.PointerEvent("pointerdown", {bubbles: true}));
    assert(popover.hidden && trigger.getAttribute("aria-expanded") === "false", "Outside tap did not close help");
    const listTrigger = doc.querySelector("#list-management .management-help-trigger");
    const listPopover = doc.querySelector("#list-management-help-popover");
    listTrigger.click();
    assert(!listPopover.hidden && listPopover.textContent.includes("angemeldeten Nutzer"), "List management help missing");
    listTrigger.click();
    assert(listPopover.hidden, "List management help did not close");
  });
  {
    const used = api.productManagementRow(source, null);
    content.append(used);
    const deleteButton = used.querySelector(".danger-button");
    deleteButton.click();
    await new Promise(resolve => win.requestAnimationFrame(resolve));
    const dialog = doc.querySelector("#app-confirm");
    test("Used product confirmation warns about statistics and named lists", () => {
    assert(dialog.open, "App confirmation dialog did not open");
    assert(win.getComputedStyle(doc.querySelector("#app-confirm-product")).fontSize === "32px", "Delete article name must use 32px");
    assert(win.getComputedStyle(doc.querySelector("#app-confirm-description")).fontSize === "16px", "Delete info must use 16px");
    assert(doc.querySelector("#app-confirm-title").textContent === "Artikel löschen?", "Wrong dialog title");
    const description = doc.querySelector("#app-confirm-description").textContent;
    assert(description.includes("Statistik für diesen Artikel wird ebenfalls gelöscht! Bisher 32 Verwendungen"), "Statistics warning missing");
    assert(description.includes("„Wocheneinkauf“, „Drogerie“"), "List names missing");
    assert(doc.activeElement.id === "cancel-app-confirm", "Safe initial focus missing");
    assert(!calls.some(call => call.save?.[0] === "delete_product"), "Deleted before confirmation");
    });
    doc.querySelector("#cancel-app-confirm").click();
    assert(!dialog.open && !calls.some(call => call.save?.[0] === "delete_product"), "Cancel did not protect the article");
    await new Promise(resolve => win.requestAnimationFrame(resolve));
    deleteButton.click();
    await new Promise(resolve => win.requestAnimationFrame(resolve));
    doc.querySelector("#accept-app-confirm").click();
    test("Only explicit confirmation deletes from the approved lists", () => {
    assert(calls.at(-1).save[0] === "delete_product", "Explicit confirmation did not delete");
    assert(calls.at(-1).save[1].confirmed_lists.length === 2, "Confirmed lists missing");
    });
    await new Promise(resolve => win.requestAnimationFrame(resolve));
    api.setDeletionInfo({product: {...source, usage: {}}, lists: []});
    deleteButton.click();
    await new Promise(resolve => win.requestAnimationFrame(resolve));
    test("Unused product without list occurrences has no statistics or list warning", () => {
      const text = doc.querySelector("#app-confirm-description").textContent;
      assert(!text.includes("Statistik") && !text.includes("aus der Liste") && !text.includes("aus den Listen"), "Unexpected warning");
    });
    doc.querySelector("#cancel-app-confirm").click();
    await new Promise(resolve => win.requestAnimationFrame(resolve));
    api.setDeletionInfo(null);
    deleteButton.click();
    await new Promise(resolve => win.requestAnimationFrame(resolve));
    test("Failed list inspection blocks blind deletion and reports the error", () => {
      assert(!dialog.open, "Dialog opened without inspection");
      assert(doc.querySelector("#catalog-message").textContent === "Listenprüfung fehlgeschlagen", "Error hidden");
    });
    used.remove();
  }
  test("Article add action uses the existing fixed footer on a long list", () => {
    assert(page.classList.contains("has-fixed-actions"), "Fixed-footer layout missing");
    assert(!footer.hidden && footer.children.length === 2, "Approved footer actions required");
    assert(footer.querySelector(".primary").textContent === "Hinzufügen", "Add action missing");
    assert(footerPosition.bottom <= win.innerHeight + 1, "Footer below viewport");
    assert(Math.abs(footerPosition.bottom - win.innerHeight) <= 1, "Footer must sit at bottom");
    assert(content.scrollHeight > content.clientHeight, "List must scroll internally");
    content.scrollTop = 1200;
    assert(Math.abs(footer.getBoundingClientRect().top - footerPosition.top) < 1, "Footer moved with list");
    content.scrollTop = content.scrollHeight;
    const lastRow = content.querySelector(".product-management-row:last-child").getBoundingClientRect();
    assert(lastRow.bottom <= footerPosition.top + 1, "Footer covers the last article");
  });
  content.scrollTop = 1200;
  const savedPosition = content.scrollTop;
  content.querySelector(".product-management-row:nth-of-type(8) .product-outline-action").click();
  test("Editing keeps approved fixed form actions", () => {
    assert(api.view() === "product-edit", "Edit view not opened");
    assert(page.classList.contains("has-fixed-actions") && !footer.hidden, "Fixed form footer missing");
    assert(footer.querySelector('[type="submit"]').form === doc.querySelector("#catalog-content form"), "Fixed submit lost its form association");
  });
  doc.querySelector("#catalog-back").click();
  await new Promise(resolve => win.requestAnimationFrame(() => win.requestAnimationFrame(resolve)));
  test("Returning from editing restores internal list scroll and fixed footer", () => {
    assert(api.view() === "products", "List not restored");
    assert(Math.abs(content.scrollTop - savedPosition) < 1, "Article list scroll position lost");
    assert(!footer.hidden && Math.abs(footer.getBoundingClientRect().top - footerPosition.top) < 1, "Footer not restored");
  });
  footer.querySelector(".primary").click();
  test("Fixed add button opens an empty new-article form", () => {
    assert(api.view() === "product-edit", "Add button did not open edit view");
    assert(doc.querySelector("#product-name").value === "", "New article must start empty");
    assert(doc.querySelector("#catalog-title").textContent === "Artikel hinzufügen", "Wrong add form");
    assert(doc.querySelector('label[for="product-name"]').classList.contains("visually-hidden"),
      "Article field label should not consume space");
  });
  for (const view of ["markets", "categories"]) {
    for (const length of [0, 60]) {
      api.setupManagementList(view, length);
      test(view + " keeps the add action fixed with " + length + " records", () => {
        const label = "Hinzufügen";
        assert(page.classList.contains("has-fixed-actions"), "Fixed layout missing");
        assert(!footer.hidden && footer.children.length === 2 && footer.textContent.includes(label), "Wrong footer action");
        if (view === "markets") {
          const cancel = footer.querySelector(".secondary"), add = footer.querySelector(".primary");
          assert(cancel.textContent === "Abbrechen" && add.textContent === "Hinzufügen", "Approved market actions missing");
          assert(Math.abs(add.getBoundingClientRect().left - cancel.getBoundingClientRect().right - 12) < 1, "Market footer spacing differs from design");
          assert(Math.abs(add.getBoundingClientRect().width - 114) < 1, "Market add button width differs from design");
        }
        const titleBottom = page.querySelector(".management-title-row").getBoundingClientRect().bottom;
        assert(content.getBoundingClientRect().top - titleBottom >= 16, "Content too close to heading");
        const before = footer.getBoundingClientRect();
        assert(Math.abs(before.bottom - win.innerHeight) < 2, "Footer not anchored at bottom");
        if (length) {
          assert(content.scrollHeight > content.clientHeight, "Long list does not scroll internally");
          content.scrollTop = content.scrollHeight;
          assert(Math.abs(footer.getBoundingClientRect().top - before.top) < 1, "Footer scrolls with list");
          assert(content.querySelector(".management-link:last-child").getBoundingClientRect().bottom <= before.top + 1, "Last record hidden behind footer");
        }
        footer.querySelector(".primary").click();
        assert(api.view() === (view === "markets" ? "market-edit" : "category-edit"), "Wrong add form");
        assert(doc.querySelector("#catalog-name").value === "", "New name not empty");
        assert(doc.querySelector("#catalog-name").getBoundingClientRect().top -
          page.querySelector(".management-title-row").getBoundingClientRect().bottom >= (view === "markets" ? 12 : 16),
          "Edit field too close to heading");
        assert(view === "markets" ? footer.hidden && !page.classList.contains("has-fixed-actions")
          : !footer.hidden && page.classList.contains("has-fixed-actions"), "Wrong add-form footer layout");
        doc.querySelector("#catalog-back").click();
        assert(api.view() === view && !footer.hidden, "List footer not restored");
      });
    }
  }
  api.setupMerge(source, target);
  test("Merge target uses the app picker, supports keyboard selection, and keeps the preview", () => {
    const trigger = doc.querySelector("#product-merge-trigger");
    const flyout = doc.querySelector("#product-merge-flyout");
    assert(!doc.querySelector("#catalog-content select, #catalog-content input[type=radio]"), "Native selector remains");
    assert(trigger.getAttribute("role") === "combobox", "Accessible combobox role missing");
    const chevron = trigger.querySelector("svg.chevron[aria-hidden='true']");
    assert(chevron, "Merge picker does not use the shared SVG chevron");
    const iconRect = chevron.getBoundingClientRect(), triggerRect = trigger.getBoundingClientRect();
    assert(Math.abs(iconRect.top + iconRect.height / 2 - triggerRect.top - triggerRect.height / 2) < 1, "Merge picker chevron is not centered");
    trigger.focus();
    trigger.dispatchEvent(new win.KeyboardEvent("keydown", {key: "ArrowDown", bubbles: true}));
    const option = doc.querySelector("#product-merge-options [role=option]");
    assert(!flyout.hidden && doc.activeElement === option, "Keyboard did not open and focus the options");
    option.click();
    assert(flyout.hidden && trigger.getAttribute("aria-expanded") === "false", "Picker did not close after selection");
    assert(doc.querySelector("#product-merge-target").value === "bier", "Target key not stored");
    assert(doc.querySelector("#product-merge-value").textContent === "Bier", "Selected target label not shown");
    assert(doc.querySelector(".product-merge-preview").textContent.includes("Eier") &&
      doc.querySelector(".product-merge-preview").textContent.includes("Bier"), "Merge preview not updated");
    doc.querySelector("#catalog-content form").requestSubmit();
    assert(doc.querySelector("#product-merge-confirm").open, "Existing merge safety confirmation was lost");
    assert(doc.querySelector("#product-merge-names").textContent === "Eier → Bier", "Merge names missing");
    assert(win.getComputedStyle(doc.querySelector("#product-merge-names")).fontSize === "32px", "Merge names must use 32px");
    assert(win.getComputedStyle(doc.querySelector("#product-merge-description")).fontSize === "16px", "Merge info must use 16px");
    doc.querySelector("#cancel-product-merge").click();
  });
  api.setupCategoryDelete();
  test("Catalog delete page keeps only a short action and opens themed safety confirmation", () => {
    const danger = doc.querySelector(".danger-section");
    const action = danger.querySelector("button");
    assert(danger.textContent.trim() === "Löschen", "The form still shows a misleading delete warning");
    assert(doc.querySelector('label[for="catalog-name"]').classList.contains("visually-hidden"),
      "Category name label should not consume space");
    action.click();
    assert(doc.querySelector("#app-confirm").open, "Catalog safety confirmation missing");
    assert(doc.querySelector("#app-confirm-title").textContent === "Kategorie löschen?", "Wrong safety title");
    assert(doc.querySelector("#app-confirm-description").textContent.includes("Backwaren"), "Safety details missing");
    assert(doc.querySelector("#app-confirm-product").hidden && doc.querySelector("#app-confirm-help-trigger").hidden,
      "Product-specific confirmation content leaked into category deletion");
    doc.querySelector("#accept-app-confirm").click();
    assert(calls.at(-1).save[0] === "delete_category", "Category was not deleted after approval");
  });
  for (const width of [320, 390, 430]) {
    frame.style.width = width + "px";
    await new Promise(resolve => win.requestAnimationFrame(resolve));
    for (const view of ["categories", "category-edit", "category-products", "products", "product-edit", "product-statistics", "product-merge"]) {
      api.setupView(view);
      test(`${view} uses the approved compact header and fixed actions at ${width}px`, () => {
        const title = doc.querySelector("#catalog-title"), help = page.querySelector(".management-help-trigger");
        const t = title.getBoundingClientRect(), h = help.getBoundingClientRect();
        const range = doc.createRange();
        range.selectNodeContents(title);
        const right = Math.max(...[...range.getClientRects()].map(rect => rect.right));
        assert(Math.abs(h.top + h.height / 2 - t.top - t.height / 2) < 1, "Help icon not centered beside the title");
        const expectedGap = width < 380 ? 10 : 16;
        assert(h.left - right >= expectedGap - 1 && h.left - right <= expectedGap + 2, "Help icon too far from visible title");
        assert(h.width === 34 && h.height === 34, "Help icon dimensions differ from design");
        assert(!doc.querySelector("#catalog-close").hidden, "Close action missing");
        assert(!footer.hidden && Math.abs(footer.getBoundingClientRect().bottom - win.innerHeight) < 1, "Footer not fixed");
        for (const button of footer.querySelectorAll("button")) {
          assert(Math.abs(button.getBoundingClientRect().width - 114) < 1, "Footer control width differs from design");
        }
        assert(doc.documentElement.scrollWidth <= width, "Page overflows horizontally");
        for (const action of content.querySelectorAll(".product-management-buttons button")) {
          assert(action.scrollWidth <= action.clientWidth, "Article action content overflows its button");
        }
      });
    }
    doc.querySelector("#product-merge-trigger").click();
    doc.querySelector("#product-merge-options [role=option]").click();
    footer.querySelector('[type="submit"]').click();
    test(`Merge confirmation retains safe focus, readable text and help at ${width}px`, () => {
      const dialog = doc.querySelector("#product-merge-confirm");
      assert(dialog.open && doc.activeElement.id === "cancel-product-merge", "Safe initial focus missing");
      const help = doc.querySelector("#product-merge-help-trigger");
      help.click();
      assert(!doc.querySelector("#product-merge-help").hidden, "Confirmation help missing");
      doc.dispatchEvent(new win.KeyboardEvent("keydown", {key: "Escape", bubbles: true, cancelable: true}));
      assert(dialog.open && doc.querySelector("#product-merge-help").hidden, "Escape should close help first");
      assert(dialog.scrollWidth <= dialog.clientWidth, "Confirmation overflows horizontally");
      const names = doc.querySelector("#product-merge-names"), info = doc.querySelector("#product-merge-description");
      assert(win.getComputedStyle(names).fontSize === "32px" && win.getComputedStyle(info).fontSize === "16px",
        "Confirmation typography differs from design");
      doc.querySelector("#cancel-product-merge").click();
    });
    await new Promise(resolve => win.requestAnimationFrame(resolve));
  }
  document.querySelector("#results").textContent = results.join("\n");
}
runTests().catch(error => {
  document.querySelector("#results").textContent = "FAIL " + error.stack;
  throw error;
});
</script>
