<!doctype html>
<html lang="de">
<meta charset="utf-8">
<title>Category management regression tests</title>
<pre id="results">Running...</pre>
<iframe id="fixture" title="Testoberfläche" style="width:390px;height:844px;border:0"></iframe>
<script>
async function runTests() {
  const base = "../../custom_components/einkaufszettel/www/";
  const [markup, script, syncStyles] = await Promise.all([
    fetch(base + "app.html").then(r => r.text()),
    fetch(base + "app.js").then(r => r.text()),
    fetch(base + "app.css").then(r => r.text()),
  ]);
  const frame = document.querySelector("#fixture");
  frame.srcdoc = markup.replace(/<script src="[^"]+" defer><\/script>/, "")
    .replace("<head>", `<head><base href="${new URL(base, location.href)}">`);
  await new Promise(resolve => frame.onload = resolve);
  const win = frame.contentWindow, doc = win.document;
  Object.defineProperty(doc, "hidden", { configurable: true, value: false });
  const messages = [], operations = [];
  const storage = new Map();
  const assert = (condition, text) => { if (!condition) throw Error(text); };
  const state = {
    categories: [{ id: "z", name: "Zwiebeln" }, { id: "b", name: "Backwaren" }, { id: "a", name: "Äpfel" }],
    supermarkets: [{ id: "m", name: "Markt", category_ids: ["z", "b"] }],
    products: [
      {key:"zwieback",name:"Zwieback",category_id:"b"},
      {key:"brot",name:"Brot",category_id:"b"},
      {key:"ährenbrot",name:"Ährenbrot",category_id:"b"},
    ],
  };
  let fail = false;
  win.confirm = () => true;
  const api = win.Function("test", "localStorage", script.replace(/initializeDesign\(\);\s*start\(\);\s*$/, "") + `
    sendCommand = async (type, payload) => test.send(type.split("/").pop(), payload);
    enqueue = async operation => { test.operations.push(operation); };
    entryId = "test"; busy = false;
    availableLists = [{entry_id:"test", name:"Test"}];
    categories = test.state.categories; supermarkets = test.state.supermarkets; products = test.state.products;
    currentItems = [
      { uid:"one", summary:"Brot", status:"needs_action", metadata:{category_id:"b", quantity:"1"}, description:"Vollkorn" },
      { uid:"two", summary:"Zwiebeln", status:"needs_action", metadata:{category_id:"z"} },
      { uid:"three", summary:"Sonstiges", status:"completed", metadata:{category_id:"deleted"} }
    ];
    selectedMarket = "m";
    render();
    return { openCatalog, render, saveCatalog, refreshSupermarkets, loadCachedSupermarkets, initializeMode,
      state: () => ({categories, supermarkets, products, currentItems, selectedMarket, catalogDraft, catalogDirty}),
      withoutMarket: () => { selectedMarket = ""; render(); },
      reset: () => { categories = test.state.categories; supermarkets = test.state.supermarkets; },
      updateConnection
    };
  `)({
    state, operations,
    send: async (command, payload) => {
      messages.push({ command, payload });
      if (fail) throw Error("Test: Speichern fehlgeschlagen");
      if (command === "save_market_categories") state.supermarkets[0].category_ids = [...payload.category_ids];
      if (command === "save_category") state.categories = state.categories.map(c => c.id === payload.category_id ? {...c, name:payload.name} : c);
      if (command === "remove_category_product") state.products = state.products.map(product =>
        product.key === payload.product_key ? {...product, category_id:null} : product);
      return structuredClone(state);
    }
  }, { getItem: key => storage.get(key) || null, setItem: (key, value) => storage.set(key, value), removeItem: key => storage.delete(key) });
  const results = [];
  function test(name, action) { action(); results.push(`PASS ${name}`); }
  const headingNames = () => [...doc.querySelectorAll(".item-category-title")].map(h => h.firstChild.textContent);
  api.initializeMode();
  const modeToggle = doc.querySelector("#mode-toggle");
  test("Planning is the default and keeps uncategorized articles at the top", () => {
    assert(!doc.querySelector("#add-form").hidden, "Planning input missing");
    assert(headingNames().join("|") === "Ohne Kategorie|Zwiebeln|Backwaren", "Planning order incorrect");
    assert(modeToggle.getAttribute("aria-label").includes("Einkaufen"), "Shopping action missing");
  });
  const originalItems = JSON.stringify(api.state().currentItems);
  modeToggle.click();
  test("Shopping hides the input, restores market order and saves only a local preference", () => {
    assert(doc.querySelector("#add-form").hidden, "Shopping input still visible");
    assert(headingNames().join("|") === "Zwiebeln|Backwaren|Ohne Kategorie", "Shopping order incorrect");
    assert(storage.get("einkaufszettel.mode") === "shopping", "Mode not persisted");
    assert(modeToggle.getAttribute("aria-label").includes("Weiter planen"), "Planning action missing");
    assert(JSON.stringify(api.state().currentItems) === originalItems && !operations.length && !messages.length, "Mode changed shopping data or sent a command");
  });
  modeToggle.click();
  api.initializeMode();
  api.render();
  test("Planning selection survives reinitialization without losing a typed draft", () => {
    const input = doc.querySelector("#new-item");
    input.value = "Neue Milch";
    modeToggle.click();
    api.initializeMode();
    api.render();
    assert(doc.querySelector("#add-form").hidden, "Saved shopping mode not restored");
    modeToggle.click();
    assert(input.value === "Neue Milch", "Mode switching lost the input draft");
    assert(headingNames()[0] === "Ohne Kategorie", "Planning order not restored");
    input.value = "";
  });
  modeToggle.click();
  test("Shopping list follows market order; missing categories appear last", () => {
    assert(headingNames().join("|") === "Zwiebeln|Backwaren|Ohne Kategorie", "Wrong grouping");
    assert(doc.querySelectorAll(".item-note").length === 1, "Optional notes missing");
    assert(doc.querySelector(".item-note").textContent === "1 · Vollkorn", "Quantity or note missing");
    assert(doc.querySelectorAll(".item").length === 3, "Items lost");
    assert(doc.querySelectorAll(".item .delete").length === 0, "Delete buttons should not be shown");
    assert(doc.querySelector(".item-name .item-note"), "Item details should stay in the item-name column");
    assert(doc.querySelector(".item-name").getAttribute("aria-keyshortcuts") === "Delete", "Keyboard delete shortcut missing");
  });
  const itemLabel = doc.querySelector('[aria-label="Bearbeiten: Brot"]');
  const editDialog = doc.querySelector("#edit-item");
  test("Article dialog has expanded dimensions for category browsing", () => {
    const dialogStyle = win.getComputedStyle(editDialog);
    const categoryListStyle = win.getComputedStyle(doc.querySelector(".category-options"));
    assert(syncStyles.includes("#edit-item { width: min(92vw, 560px)"), "Article dialog maximum width was not increased");
    assert(parseFloat(dialogStyle.width) >= win.innerWidth * 0.9, "Article dialog did not use the available width");
    assert(parseFloat(dialogStyle.height) >= win.innerHeight * 0.8, "Article dialog height was not doubled");
    assert(parseFloat(categoryListStyle.maxHeight) >= win.innerHeight * 0.6, "Category list height was not expanded");
  });
  test("Long-press trigger suppresses the browser touch highlight", () => {
    assert(["transparent", "rgba(0, 0, 0, 0)"].includes(win.getComputedStyle(itemLabel).getPropertyValue("-webkit-tap-highlight-color")), "Native touch highlight remains visible on the article name");
  });
  test("Sync status is tucked into a stable list-title flyout", () => {
    const title = doc.querySelector(".list-title");
    const actions = doc.querySelector(".sync-actions");
    assert(title.contains(actions), "Sync controls are not next to the selected list");
    assert(Math.abs(actions.getBoundingClientRect().right - title.getBoundingClientRect().right) < 1, "Sync controls are not right-aligned with the list title");
    const syncArrow = doc.querySelector(".sync-details-arrow");
    const syncToggle = doc.querySelector("#sync-details-toggle");
    assert(Math.abs(syncArrow.getBoundingClientRect().left - syncToggle.getBoundingClientRect().left) < 1, "Sync flyout arrow is not close to the circle");
    assert(syncArrow.getBoundingClientRect().left - doc.querySelector("#sync svg").getBoundingClientRect().right <= 7, "Gap beside sync circle too large");
    const app = doc.querySelector("main.app");
    assert(Math.abs(actions.getBoundingClientRect().right - (app.getBoundingClientRect().right - parseFloat(win.getComputedStyle(app).paddingRight))) < 1, "Controls are not at the right content edge");
    assert(modeToggle.getBoundingClientRect().right <= actions.getBoundingClientRect().left, "Mode and sync overlap");
    assert(syncStyles.includes("animation: sync-spin-clockwise 1.1s linear infinite"), "Sync animation direction is not clockwise");
    assert(/@keyframes sync-spin-clockwise\s*\{\s*to\s*\{\s*transform:\s*rotate\(360deg\)/.test(syncStyles), "Sync animation does not rotate clockwise");
    assert(!doc.querySelector(".sync-card"), "Variable-height sync card remains in the page flow");
    assert(doc.querySelector("#sync-details-toggle").getAttribute("aria-controls") === "sync-flyout", "Status trigger is not associated with its flyout");
    const y = doc.querySelector("#add-form").getBoundingClientRect().top;
    doc.querySelector("#sync-details-toggle").click();
    assert(!doc.querySelector("#sync-flyout").hidden, "Status flyout did not open");
    assert(doc.querySelector("#add-form").getBoundingClientRect().top === y, "Opening sync status shifted the list");
    api.updateConnection("online", "Alle Änderungen wurden synchronisiert.");
    assert(actions.dataset.status === "online" && doc.querySelector("#connection-dot").classList.contains("online"), "Online status color missing");
    api.updateConnection("pending");
    assert(actions.dataset.status === "pending" && doc.querySelector("#connection-dot").classList.contains("pending"), "Pending status color missing");
    doc.activeElement.dispatchEvent(new win.KeyboardEvent("keydown", {key:"Escape", bubbles:true, cancelable:true}));
    assert(doc.querySelector("#sync-flyout").hidden, "Escape did not close status flyout");
    assert(doc.activeElement === doc.querySelector("#sync-details-toggle"), "Escape did not return focus to status trigger");
    api.updateConnection("offline");
  });
  const pause = ms => new Promise(resolve => win.setTimeout(resolve, ms));
  function itemPointer(type, options = {}) {
    itemLabel.dispatchEvent(new win.PointerEvent(type, {
      pointerId: 81, pointerType: "touch", isPrimary: true, button: 0,
      clientX: 240, clientY: 120, bubbles: true, cancelable: true, ...options,
    }));
  }
  itemPointer("pointerdown");
  itemPointer("pointerup");
  itemLabel.dispatchEvent(new win.MouseEvent("click", {detail: 1, bubbles: true}));
  await pause(550);
  test("Short tap does not open article details or leave a pending long press", () => {
    assert(!editDialog.open, "Short tap opened details");
  });
  itemPointer("pointerdown");
  await pause(200);
  assert(!editDialog.open, "Long press opened before the threshold");
  await pause(450);
  test("Holding for half a second opens article details", () => {
    assert(editDialog.open, "Long press did not open details");
    assert(doc.querySelector("#edit-summary").value === "Brot", "Wrong article opened");
    assert(doc.activeElement === doc.querySelector("#edit-item-title"), "Opening details focused a text field");
    assert(doc.querySelector("#edit-category").value === "b", "Item category missing");
    assert(doc.querySelector("#edit-category-options").children.length === 4, "Category menu is missing an option");
  });
  itemPointer("pointerup");
  const categoryTrigger = doc.querySelector("#edit-category-trigger");
  categoryTrigger.click();
  test("Category search flyout opens without focusing the keyboard field", () => {
    assert(!doc.querySelector("#edit-category-flyout").hidden, "Category flyout did not open");
    assert(doc.activeElement !== doc.querySelector("#edit-category-search"), "Search field received automatic focus");
  });
  const categorySearch = doc.querySelector("#edit-category-search");
  categorySearch.focus();
  categorySearch.value = "ä";
  categorySearch.dispatchEvent(new win.Event("input", {bubbles:true}));
  test("Category search filters case-insensitively and reports empty results", () => {
    assert(doc.querySelectorAll("#edit-category-options .category-option:not([hidden])").length === 1, "Search did not filter categories");
    categorySearch.value = "not-a-category";
    categorySearch.dispatchEvent(new win.Event("input", {bubbles:true}));
    assert(!doc.querySelector("#edit-category-empty").hidden, "Empty result message missing");
  });
  categorySearch.value = "";
  categorySearch.dispatchEvent(new win.Event("input", {bubbles:true}));
  categorySearch.dispatchEvent(new win.KeyboardEvent("keydown", {key:"ArrowDown", bubbles:true, cancelable:true}));
  doc.activeElement.dispatchEvent(new win.KeyboardEvent("keydown", {key:"Escape", bubbles:true, cancelable:true}));
  test("Escape closes category flyout without closing article dialog", () => {
    assert(editDialog.open, "Escape closed the article dialog instead of its flyout");
    assert(doc.querySelector("#edit-category-flyout").hidden, "Escape did not close category flyout");
    assert(doc.activeElement === categoryTrigger, "Escape did not return focus to category trigger");
  });
  categoryTrigger.click();
  doc.querySelector('#edit-category-options [data-category-id="a"]').click();
  test("Selecting a category updates only the edit draft", () => {
    assert(doc.querySelector("#edit-category").value === "a", "Category selection not reflected in draft");
    assert(api.state().currentItems.find(item => item.uid === "one").metadata.category_id === "b", "Category selection changed item before save");
  });
  doc.querySelector("#cancel-edit").click();
  await pause(50);
  test("Closing article dialog restores focus to its list item", () => {
    assert(doc.activeElement.matches(".item-name") && doc.activeElement.dataset.uid === "one", "Closing dialog did not restore focus to the article");
    assert(operations.every(operation => operation.type !== "update_item"), "Cancelling article edit queued an update");
  });
  const missingCategoryItem = doc.querySelector('[aria-label="Bearbeiten: Sonstiges"]');
  missingCategoryItem.click();
  test("Unavailable existing category remains visible without becoming a new choice", () => {
    assert(doc.querySelector("#edit-category-value").textContent === "Nicht verfügbare Kategorie", "Unavailable category label lost");
    assert(!doc.querySelector("#edit-category-unavailable").hidden, "Unavailable category hint missing");
    assert(!doc.querySelector('#edit-category-options [data-category-id="deleted"]'), "Unavailable category was offered as a new choice");
  });
  doc.querySelector("#edit-category-trigger").click();
  doc.querySelector('#edit-category-options [data-category-id="a"]').click();
  doc.querySelector("#edit-item-form").requestSubmit();
  await pause(0);
  test("Replacing an unavailable category uses the existing save operation", () => {
    assert(operations.at(-1).uid === "three", "Updated the wrong article");
    assert(operations.at(-1).metadata.category_id === "a", "Replacement category was not saved");
  });
  for (const [name, type, options] of [
    ["Scrolling", "pointermove", {clientY: 140}],
    ["Swiping", "pointermove", {clientX: 220}],
    ["Pointer cancellation", "pointercancel", {}],
    ["Leaving the article", "pointerleave", {}],
  ]) {
    itemPointer("pointerdown");
    itemPointer(type, options);
    await pause(550);
    itemPointer("pointerup");
    test(`${name} cancels article long press`, () => {
      assert(!editDialog.open, `${name} opened article details`);
    });
  }
  itemPointer("pointerdown", {pointerType: "mouse"});
  await pause(550);
  test("Mouse long press also opens article details", () => {
    assert(editDialog.open, "Mouse hold did not open details");
  });
  itemPointer("pointerup");
  editDialog.close();
  itemPointer("pointerdown");
  await pause(550);
  const releaseTarget = doc.querySelector("#edit-category-trigger");
  const cancelEdit = doc.querySelector("#cancel-edit");
  let releaseClickHandled = false;
  let releasePointerUpHandled = false;
  let releasePointerMoveHandled = false;
  releaseTarget.addEventListener("click", () => { releaseClickHandled = true; });
  releaseTarget.addEventListener("pointerup", () => { releasePointerUpHandled = true; });
  releaseTarget.addEventListener("pointermove", () => { releasePointerMoveHandled = true; });
  const prematureTouch = new win.PointerEvent("pointerdown", {
    pointerId:82, pointerType:"touch", isPrimary:false, button:0, bubbles:true, cancelable:true,
  });
  releaseTarget.dispatchEvent(prematureTouch);
  assert(prematureTouch.defaultPrevented, "A second touch was accepted before the long-press finger was released");
  const releasePointerMove = new win.PointerEvent("pointermove", {
    pointerId:81, pointerType:"touch", isPrimary:true, button:0, bubbles:true, cancelable:true,
  });
  releaseTarget.dispatchEvent(releasePointerMove);
  const releasePointerUp = new win.PointerEvent("pointerup", {
    pointerId:81, pointerType:"touch", isPrimary:true, button:0, bubbles:true, cancelable:true,
  });
  releaseTarget.dispatchEvent(releasePointerUp);
  const releaseClick = new win.PointerEvent("click", {
    pointerId:-1, pointerType:"mouse", isPrimary:true, button:0, detail:1, bubbles:true, cancelable:true,
  });
  releaseTarget.dispatchEvent(releaseClick);
  test("Touch release after long press cannot activate the newly opened dialog", () => {
    assert(editDialog.open, "Release click closed the article dialog");
    assert(releasePointerMove.defaultPrevented && !releasePointerMoveHandled, "Pointer movement reached a dialog control");
    assert(releasePointerUp.defaultPrevented && !releasePointerUpHandled, "Release pointerup reached the dialog");
    assert(releaseClick.defaultPrevented && !releaseClickHandled, "Release click was not suppressed");
    assert(doc.querySelector("#edit-category-flyout").hidden, "Release opened the category flyout");
  });
  const nextTouch = new win.PointerEvent("pointerdown", {
    pointerId:83, pointerType:"touch", isPrimary:true, button:0, bubbles:true, cancelable:true,
  });
  cancelEdit.dispatchEvent(nextTouch);
  test("A new touch is accepted after the long-press touch is released", () => {
    assert(!nextTouch.defaultPrevented, "New touch remained blocked after release");
  });
  cancelEdit.dispatchEvent(new win.PointerEvent("pointerup", {
    pointerId:83, pointerType:"touch", isPrimary:true, button:0, bubbles:true,
  }));
  let nextTouchClickHandled = false;
  cancelEdit.addEventListener("click", () => { nextTouchClickHandled = true; }, {once:true});
  const nextTouchClick = new win.PointerEvent("click", {
    pointerId:-1, pointerType:"mouse", isPrimary:true, button:0, detail:1, bubbles:true, cancelable:true,
  });
  cancelEdit.dispatchEvent(nextTouchClick);
  assert(!nextTouchClick.defaultPrevented && nextTouchClickHandled, "Next touch click was suppressed");
  itemLabel.click();
  test("Keyboard and assistive activation still open article details", () => {
    assert(editDialog.open, "Accessible activation failed");
  });
  editDialog.close();
  const checkbox = doc.querySelector('[aria-label="Erledigt: Brot"]');
  checkbox.click();
  test("Checkbox still queues status changes immediately without opening details", () => {
    assert(operations.at(-1).uid === "one" && operations.at(-1).status === "completed", "Checkbox delayed");
    assert(!editDialog.open, "Checkbox opened details");
  });
  const swipeRow = doc.querySelector(".item");
  swipeRow.dispatchEvent(new win.PointerEvent("pointerdown", {
    pointerId: 1, pointerType: "touch", button: 0, clientX: 240, clientY: 120, bubbles: true
  }));
  swipeRow.dispatchEvent(new win.PointerEvent("pointermove", {
    pointerId: 1, pointerType: "touch", clientX: 150, clientY: 120, bubbles: true, cancelable: true
  }));
  swipeRow.dispatchEvent(new win.PointerEvent("pointerup", {
    pointerId: 1, pointerType: "touch", clientX: 150, clientY: 120, bubbles: true
  }));
  await new Promise(resolve => win.setTimeout(resolve, 220));
  test("Left swipe queues item deletion", () => {
    assert(operations.some(operation => operation.type === "delete_item" && operation.uid === "two"), "Swipe did not queue deletion");
  });
  test("Without a market groups follow A-Z, with uncategorized items last", () => {
    api.withoutMarket();
    assert(headingNames().join("|") === "Backwaren|Zwiebeln|Ohne Kategorie", "Wrong no-market order");
  });
  test("Dedicated category overview is alphabetically sorted", () => {
    api.openCatalog("categories");
    assert(doc.querySelector("main.app").hidden, "Shopping page not hidden");
    assert(!doc.querySelector("#catalog-page").hidden, "Catalog not shown");
    const names = [...doc.querySelectorAll(".management-link")].map(b => b.textContent);
    assert(names.join("|") === "Äpfel  ›|Backwaren  ›|Zwiebeln  ›", "Not German A-Z");
  });
  test("Market edit links to a separate order page", () => {
    api.openCatalog("market-edit", state.supermarkets[0]);
    doc.querySelector(".category-navigation").click();
    assert(doc.querySelector("#catalog-title").textContent === "Produktkategorien bearbeiten", "Wrong destination");
    assert(doc.querySelectorAll(".move-grip").length === 2, "Drag grips missing");
    assert(doc.querySelector('[aria-label="Zwiebeln nach oben"]').disabled, "First up not disabled");
    assert(doc.querySelector('[aria-label="Backwaren nach unten"]').disabled, "Last down not disabled");
    doc.querySelector('[aria-label="Backwaren nach oben"]').click();
    assert(api.state().catalogDraft.category_ids.join() === "b,z", "Move failed");
    assert(state.supermarkets[0].category_ids.join() === "z,b", "Draft leaked before save");
  });
  test("Keyboard and live pointer sorting update the same draft before release", () => {
    doc.querySelector(".move-grip").dispatchEvent(new win.KeyboardEvent("keydown", {key:"ArrowDown", bubbles:true}));
    assert(api.state().catalogDraft.category_ids.join() === "z,b", "Keyboard move failed");
    const list = doc.querySelector(".category-order");
    // Synthetic PointerEvents do not create a browser-owned active pointer.
    list.setPointerCapture = () => {};
    const grip = list.querySelector(".move-grip");
    grip.scrollIntoView({block:"center"});
    const start = grip.getBoundingClientRect();
    const target = list.children[1].getBoundingClientRect();
    grip.dispatchEvent(new win.PointerEvent("pointerdown", {pointerId:12, isPrimary:true, button:0, clientX:start.left + 20, clientY:start.top + 20, bubbles:true}));
    win.dispatchEvent(new win.PointerEvent("pointermove", {pointerId:12, clientX:start.left + 20, clientY:target.bottom - 5, cancelable:true}));
    assert(api.state().catalogDraft.category_ids.join() === "b,z", "No live sorting");
    assert(doc.querySelector(".category-drag-ghost"), "Floating row missing");
    assert(state.supermarkets[0].category_ids.join() === "z,b", "Drag leaked before save");
    assert(list.children[0].querySelector(".secondary").disabled, "First up control stale");
    win.dispatchEvent(new win.PointerEvent("pointerup", {pointerId:12}));
    assert(!doc.querySelector(".category-drag-ghost"), "Floating row leaked");
    assert(api.state().catalogDraft.category_ids.join() === "b,z", "Drop lost order");
  });
  test("Pointer cancellation restores order; large grips and compact SVG back navigation", () => {
    const list = doc.querySelector(".category-order");
    list.setPointerCapture = () => {};
    const grip = list.querySelector(".move-grip");
    const start = grip.getBoundingClientRect(), target = list.children[1].getBoundingClientRect();
    assert(start.width >= 48 && start.height >= 48, "Grip too small");
    grip.dispatchEvent(new win.PointerEvent("pointerdown", {pointerId:13, isPrimary:true, button:0, clientX:start.left + 20, clientY:start.top + 20, bubbles:true}));
    win.dispatchEvent(new win.PointerEvent("pointermove", {pointerId:13, clientX:start.left + 20, clientY:target.bottom - 5, cancelable:true}));
    assert(api.state().catalogDraft.category_ids.join() === "z,b", "Cancel test did not move");
    win.dispatchEvent(new win.PointerEvent("pointercancel", {pointerId:13}));
    assert(api.state().catalogDraft.category_ids.join() === "b,z", "Cancel did not restore");
    assert(!doc.querySelector(".category-drag-ghost"), "Cancel leaked ghost");
    for (const back of doc.querySelectorAll(".management-back")) {
      assert(back.querySelector("svg"), "Back arrow not SVG");
      assert(win.getComputedStyle(back).height === "32px", "Back not variant C");
    }
  });
  test("Selection comes from A-Z store, does not reset existing order", () => {
    doc.querySelector("#catalog-content > .primary").click();
    const choices = [...doc.querySelectorAll(".category-choice")];
    assert(choices.map(c=>c.textContent).join() === "Äpfel,Backwaren,Zwiebeln", "Selection not A-Z");
    choices[0].querySelector("input").click();
    doc.querySelector("#catalog-content > .primary").click();
    assert(api.state().catalogDraft.category_ids.join() === "b,z,a", "Selection reset order");
    doc.querySelector('[aria-label="Zwiebeln aus diesem Markt entfernen"]').click();
    assert(api.state().catalogDraft.category_ids.join() === "b,a", "Removal failed");
    assert(api.state().categories.length === 3, "Central category deleted");
  });
  test("Cancelling a discard prompt keeps unsaved order", () => {
    win.confirm = () => false;
    doc.querySelector("#catalog-back").click();
    assert(doc.querySelector("#catalog-title").textContent === "Produktkategorien bearbeiten", "Left dirty page");
    assert(api.state().catalogDraft.category_ids.join() === "b,a", "Dirty order lost");
    win.confirm = () => true;
  });
  await api.saveCatalog("save_market_categories", { market_id:"m", category_ids:api.state().catalogDraft.category_ids }, "markets");
  assert(state.supermarkets[0].category_ids.join() === "b,a", "Order not saved");
  assert(storage.has("einkaufszettel.catalog"), "Atomic offline catalog cache missing");
  results.push("PASS Saving persists order and offline cache");
  api.loadCachedSupermarkets();
  assert(api.state().supermarkets[0].category_ids.join() === "b,a", "Cached order lost");
  assert(api.state().categories.length === 3, "Cached categories lost");
  results.push("PASS Atomic offline catalog reload preserves categories and order");
  fail = true;
  api.openCatalog("category-edit", state.categories[0]);
  const name = doc.querySelector("#catalog-name");
  name.value = "Neuer Name";
  name.dispatchEvent(new win.Event("input", {bubbles:true}));
  await api.saveCatalog("save_category", {category_id:"z", name:name.value}, "categories");
  assert(api.state().catalogDirty, "Failed save cleared dirty draft");
  assert(doc.querySelector("#catalog-message").textContent.includes("fehlgeschlagen"), "Failure hidden");
  assert(doc.querySelector("#catalog-name").value === "Neuer Name", "Failed save lost input");
  results.push("PASS Failed save retains draft and reports error");
  fail = false;
  doc.querySelector("#catalog-back").click();
  doc.querySelector("#catalog-back").click();
  doc.querySelector('[aria-label="Bearbeiten: Brot"]').click();
  assert(doc.querySelector("#edit-category").value === "b", "Item category missing");
  assert(doc.querySelector("#edit-quantity").value === "1", "Item quantity missing");
  doc.querySelector("#edit-notes").value = "Geschnitten";
  doc.querySelector("#edit-item-form").requestSubmit();
  await Promise.resolve();
  assert(!("category_id" in operations.at(-1).metadata), "Unchanged category should not overwrite a newer product rule");
  assert(operations.at(-1).description === "Geschnitten", "Notes not enqueued");
  results.push("PASS Item category, quantity and notes use existing offline operation queue");
  assert(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth, "Mobile horizontal overflow");
  const listName = doc.querySelector("#list-name");
  const originalName = listName.textContent;
  listName.textContent = "Wocheneinkauf für die ganze Familie";
  for (const width of [320, 390, 700]) {
    frame.style.width = `${width}px`;
    await pause(50);
    for (let mode = 0; mode < 2; mode++) {
      modeToggle.click();
      const rect = selector => doc.querySelector(selector).getBoundingClientRect();
      const app = doc.querySelector("main.app");
      const edge = app.getBoundingClientRect().right - parseFloat(win.getComputedStyle(app).paddingRight);
      assert(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth, `${width}px horizontal overflow`);
      assert(Math.abs(rect(".sync-actions").right - edge) < 1, `${width}px sync not at content edge`);
      assert(rect(".list-title h1").right <= rect("#mode-toggle").left, `${width}px title overlaps mode`);
      assert(rect("#mode-toggle").right <= rect(".sync-actions").left, `${width}px mode overlaps sync`);
      assert(rect("#mode-toggle").width === 44 && rect("#mode-toggle").height === 44, "Mode touch target too small");
      const before = doc.querySelector("#items").getBoundingClientRect().top;
      doc.querySelector("#sync-details-toggle").click();
      assert(doc.querySelector("#items").getBoundingClientRect().top === before, "Sync flyout shifted the list");
      doc.querySelector("#sync-details-toggle").click();
    }
  }
  listName.textContent = originalName;
  frame.style.width = "390px";
  results.push("PASS Both modes keep long names and right-aligned controls separate at 320/390/700px");
  // Step the animation clock explicitly, including in headless virtual-time runs.
  const requestFrame = win.requestAnimationFrame, cancelFrame = win.cancelAnimationFrame;
  const frames = new Map();
  let frameId = 0;
  win.requestAnimationFrame = callback => { frames.set(++frameId, callback); return frameId; };
  win.cancelAnimationFrame = id => frames.delete(id);
  state.categories = Array.from({length:30}, (_, index) => ({id:`long-${index}`, name:`Kategorie ${index + 1}`}));
  api.reset();
  const order = state.categories.map(category => category.id);
  api.openCatalog("market-order", {...state.supermarkets[0], category_ids:order});
  const list = doc.querySelector(".category-order");
  list.setPointerCapture = () => {};
  const outside = new win.PointerEvent("pointerdown", {pointerId:20, isPrimary:true, button:0, bubbles:true, cancelable:true});
  list.querySelector(".order-name").dispatchEvent(outside);
  assert(!outside.defaultPrevented, "Normal scrolling blocked outside grip");
  assert(win.getComputedStyle(list.querySelector(".order-name")).touchAction === "auto", "Row blocks native touch scroll");
  const grip = list.querySelector(".move-grip");
  grip.scrollIntoView({block:"center"});
  const start = grip.getBoundingClientRect();
  const offsetY = start.top + 20 - grip.closest("li").getBoundingClientRect().top;
  const pointer = (type, y, pointerId = 21) => new win.PointerEvent(type, {
    pointerId, pointerType:"touch", isPrimary:true, button:0,
    clientX:start.left + 20, clientY:y, bubbles:true, cancelable:true,
  });
  grip.dispatchEvent(pointer("pointerdown", start.top + 20));
  win.dispatchEvent(pointer("pointermove", win.innerHeight - 4));
  const ghost = doc.querySelector(".category-drag-ghost");
  assert(ghost && Math.abs(parseFloat(ghost.style.top) - (win.innerHeight - 4 - offsetY)) < 1, "Floating row not at touch position");
  const ghostTop = ghost.style.top;
  win.dispatchEvent(pointer("pointermove", win.innerHeight - 24));
  assert(parseFloat(ghost.style.top) === parseFloat(ghostTop) - 20, "Ghost did not follow pointer");
  win.dispatchEvent(pointer("pointermove", win.innerHeight - 4));
  win.dispatchEvent(pointer("pointerup", 0, 99));
  assert(doc.querySelector(".category-drag-ghost"), "Unrelated pointer ended drag");
  const scrollBefore = win.scrollY;
  for (let time = 16; time <= 512; time += 16) {
    const pending = [...frames.values()];
    frames.clear();
    pending.forEach(callback => callback(time));
  }
  assert(win.scrollY > scrollBefore + 20, "Edge scrolling did not advance");
  assert(api.state().catalogDraft.category_ids.indexOf(order[0]) > 1, "Long list did not reorder live");
  win.dispatchEvent(new win.KeyboardEvent("keydown", {key:"Escape", cancelable:true}));
  assert(api.state().catalogDraft.category_ids.join() === order.join(), "Escape did not restore original order");
  assert(!api.state().catalogDirty, "Escape did not restore clean draft");
  assert(!doc.querySelector(".category-drag-ghost"), "Escape leaked floating row");
  assert(frames.size === 0, "Escape leaked animation loop");
  results.push("PASS Touch pointer follows finger, ignores other pointers, edge-scrolls and rolls back on Escape");
  grip.scrollIntoView({block:"center"});
  const next = list.children[1].getBoundingClientRect();
  grip.dispatchEvent(pointer("pointerdown", grip.getBoundingClientRect().top + 20));
  win.dispatchEvent(pointer("pointermove", next.bottom - 2));
  assert(doc.querySelector(".category-drag-ghost"), "Navigation test did not drag");
  api.openCatalog("categories");
  assert(!doc.querySelector(".category-drag-ghost"), "Navigation leaked drag");
  assert(api.state().catalogDraft.category_ids.length === 0, "Drag rollback overwrote new page draft");
  assert(frames.size === 0, "Navigation leaked animation loop");
  win.requestAnimationFrame = requestFrame;
  win.cancelAnimationFrame = cancelFrame;
  results.push("PASS Navigation cleans up drag without overwriting the new draft");
  state.categories=[{id:"z",name:"Zwiebeln"},{id:"b",name:"Backwaren"},{id:"a",name:"Äpfel"}];
  api.reset();
  api.openCatalog("category-edit", state.categories.find(category=>category.id==="b"));
  const productLink = [...doc.querySelectorAll("#catalog-content button")].find(button=>button.textContent.startsWith("Zugeordnete Produkte"));
  assert(productLink, "Category edit has no assigned-products button");
  productLink.click();
  await new Promise(resolve=>setTimeout(resolve,0));
  assert(doc.querySelector("#catalog-title").textContent==="Zugeordnete Produkte", "Wrong product page");
  assert(doc.querySelector("#catalog-back span").textContent==="Kategorie bearbeiten", "Missing parent navigation");
  const productNames=()=>[...doc.querySelectorAll(".category-product-row > span")].map(node=>node.textContent);
  assert(productNames().join("|")==="Ährenbrot|Brot|Zwieback", "Assigned products not alphabetic or absent products missing");
  results.push("PASS Assigned products page shows permanent products alphabetically, including absent shopping items");
  let asked=0;
  win.confirm=()=>{asked++; return false;};
  const sentBefore=messages.length;
  doc.querySelector('[aria-label="Kategoriezuordnung entfernen: Brot"]').click();
  assert(asked===1 && messages.length===sentBefore && productNames().includes("Brot"), "Cancelled removal changed data");
  results.push("PASS Cancelling product removal sends no command and keeps assignment");
  win.confirm=()=>true;
  fail=true;
  await api.saveCatalog("remove_category_product",{category_id:"b",product_key:"brot"},"category-products");
  assert(productNames().includes("Brot"), "Failed removal hid product");
  assert(doc.querySelector("#catalog-message").textContent.includes("fehlgeschlagen"), "Removal failure hidden");
  fail=false;
  doc.querySelector('[aria-label="Kategoriezuordnung entfernen: Brot"]').click();
  await new Promise(resolve=>setTimeout(resolve,0));
  assert(!productNames().includes("Brot"), "Removed product still assigned");
  assert(api.state().currentItems.some(item=>item.uid==="one"), "Removal deleted shopping item");
  assert(api.state().currentItems.find(item=>item.uid==="one").metadata.category_id===null, "Shopping item retained removed category");
  assert(api.state().currentItems.find(item=>item.uid==="one").description==="Vollkorn", "Removal lost local details");
  const cachedProducts=JSON.parse(storage.get("einkaufszettel.catalog")).products;
  assert(cachedProducts.find(product=>product.key==="brot").category_id===null, "Offline cache lost explicit removal");
  api.loadCachedSupermarkets();
  assert(api.state().products.find(product=>product.key==="brot").category_id===null, "Offline reload revived removed category");
  assert(doc.documentElement.scrollWidth<=doc.documentElement.clientWidth, "Product page mobile overflow");
  results.push("PASS Confirmed removal only clears category, retains item/details and persists removal across offline reload");
  doc.querySelector("#catalog-back").click();
  assert(doc.querySelector("#catalog-title").textContent==="Kategorie bearbeiten", "Product page back did not return to category editor");
  results.push("PASS Product page returns to category editor");
  document.querySelector("#results").textContent = results.join("\n");
}
runTests().catch(error => {
  document.querySelector("#results").textContent = `FAIL ${error.stack}`;
  throw error;
});
</script>
