<!doctype html>
<html lang="de">
<meta charset="utf-8">
<title>Article image regression tests</title>
<pre id="results">Running...</pre>
<iframe id="fixture" title="Artikeldialog" style="width:390px;height:844px;border:0"></iframe>
<script>
async function runTests() {
  const base = "../../custom_components/einkaufszettel/www/";
  const [markup, script] = await Promise.all(["app.html", "app.js"].map(file =>
    fetch(base + file, {cache:"no-store"}).then(response => response.text())));
  const frame = document.querySelector("#fixture");
  frame.srcdoc = markup.replace(/<script src="[^"]+" defer><\/script>/, "")
    .replace("<head>", `<head><base href="${new URL(base, location.href)}">`);
  await new Promise(resolve => frame.onload = resolve);
  const win = frame.contentWindow, doc = win.document, operations = [];
  const storage = {getItem: () => null, setItem() {}, removeItem() {}};
  const api = win.Function("test", "localStorage",
    script.replace(/initializeDesign\(\);\s*start\(\);\s*$/, "") + `
      enqueue = async operation => { test.operations.push(operation); };
      entryId = "test"; busy = false;
      categories = []; supermarkets = []; products = [];
      currentItems = [{uid:"one",summary:"Tomaten",status:"needs_action",metadata:{quantity:"2"},description:"reif"}];
      render();
      return {state: () => currentItems, render, setMarket: market => {
        supermarkets = [market]; selectedMarket = market.id; renderMarketSelection();
      }};
    `)( {operations}, storage);
  const assert = (condition, message) => { if (!condition) throw Error(message); };
  const results = [];
  const label = doc.querySelector('[aria-label="Bearbeiten: Tomaten"]');
  assert(!label.querySelector(".item-photo-icon"), "Photo indicator shown without an image");
  assert(win.getComputedStyle(label.querySelector(".item-note")).fontSize === "13px", "Existing item note font size changed");
  label.click();
  assert(doc.querySelector("#edit-item").open, "Article editor did not open");
  assert(doc.querySelector("#edit-image-upload").accept.includes("image/png"), "File selection missing");
  assert(doc.querySelector("#edit-image-camera").getAttribute("capture") === "environment", "Camera capture missing");
  assert(win.getComputedStyle(doc.querySelector("#edit-item-form")).gap === "10px", "Article fields are not compactly spaced");
  assert(win.getComputedStyle(doc.querySelector("#edit-quantity")).padding === "10px", "Article fields have excessive padding");

  const canvas = doc.createElement("canvas");
  canvas.width = 800; canvas.height = 600;
  canvas.getContext("2d").fillRect(0, 0, 8, 8);
  const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
  const transfer = new win.DataTransfer();
  transfer.items.add(new win.File([blob], "artikel.png", {type:"image/png"}));
  const upload = doc.querySelector("#edit-image-upload");
  upload.files = transfer.files;
  upload.dispatchEvent(new win.Event("change", {bubbles:true}));
  for (let attempt = 0; attempt < 50 && doc.querySelector("#edit-item-form [type=submit]").disabled; attempt++) {
    await new Promise(resolve => win.setTimeout(resolve, 100));
  }
  assert(!doc.querySelector("#edit-image-preview").hidden, "Selected image preview missing");
  doc.querySelector("#edit-item-form").requestSubmit();
  await new Promise(resolve => win.setTimeout(resolve, 0));
  const image = operations.at(-1).metadata.image;
  assert(/^data:image\/(?:png|webp);base64,/.test(image), "Image was not queued with article metadata");
  results.push("PASS File image is optimized, previewed and saved through the offline operation");

  api.state()[0].metadata.image = image;
  api.render();
  const savedLabel = doc.querySelector('[aria-label="Bearbeiten: Tomaten"]');
  const photoButton = doc.querySelector('[aria-label="Foto von Tomaten anzeigen"]');
  const photoIcon = photoButton.querySelector(".item-photo-icon");
  assert(photoIcon && photoIcon.getAttribute("aria-hidden") === "true", "Photo icon missing for an item with an image");
  assert(win.getComputedStyle(photoIcon).width === "32px", "Photo indicator is not the expected larger size");
  const photoQuantity = savedLabel.querySelector(".item-photo-meta .item-note");
  assert(photoQuantity.textContent === "2", "Photo item should show only its quantity");
  assert(!savedLabel.querySelector(".item-note").textContent.includes("reif"), "Photo item should hide its extra information");
  assert(win.getComputedStyle(savedLabel.querySelector(".item-note")).fontSize === "13px", "Quantity font size changed");
  assert(savedLabel.classList.contains("has-photo"), "Photo item layout class missing");
  const columnGap = parseFloat(win.getComputedStyle(savedLabel).columnGap);
  const expectedQuantityLeft = savedLabel.getBoundingClientRect().left +
    (savedLabel.getBoundingClientRect().width - columnGap) * 0.52 + columnGap;
  assert(Math.abs(photoQuantity.getBoundingClientRect().left - expectedQuantityLeft) < 1,
    "Photo quantity moved from the existing details column");
  const rowRect = savedLabel.closest(".item-main").getBoundingClientRect();
  const iconButtonRect = photoButton.getBoundingClientRect();
  assert(Math.abs(iconButtonRect.right - rowRect.right) < 1, "Photo icon is not aligned at the far right of the row");

  photoButton.click();
  const photoDialog = doc.querySelector("#item-photo-dialog");
  const photoViewport = doc.querySelector("#item-photo-viewport");
  const photoImage = doc.querySelector("#item-photo-image");
  assert(photoDialog.open, "Tapping the photo icon did not open the image viewer");
  assert(doc.querySelector("#item-photo-dialog-title").textContent === "Artikelbild",
    "Photo viewer title should remain visible");
  assert(!photoDialog.querySelector("#item-photo-caption"),
    "Photo viewer should not display text below the image");
  assert(photoImage.src === image && photoImage.alt === "Foto von Tomaten", "Image viewer did not show the selected item image");
  photoViewport.dispatchEvent(new win.WheelEvent("wheel", {
    bubbles: true, cancelable: true, deltaY: -100, clientX: 190, clientY: 220,
  }));
  assert(photoImage.style.transform.includes("scale(1.2)"), "Mouse wheel did not zoom the image");
  for (let step = 0; step < 20; step++) {
    photoViewport.dispatchEvent(new win.WheelEvent("wheel", {
      bubbles: true, cancelable: true, deltaY: -100, clientX: 190, clientY: 220,
    }));
  }
  assert(photoImage.style.transform.endsWith("scale(5)"), "Zoom exceeded or missed its maximum level");
  photoViewport.dispatchEvent(new win.MouseEvent("dblclick", {
    bubbles: true, clientX: 190, clientY: 220,
  }));
  assert(photoImage.style.transform.endsWith("scale(1)"), "Double-click did not toggle zoom out");
  photoViewport.dispatchEvent(new win.MouseEvent("dblclick", {
    bubbles: true, clientX: 190, clientY: 220,
  }));
  assert(photoImage.style.transform.includes("scale(2.5)"), "Double-click did not toggle zoom in");
  photoViewport.dispatchEvent(new win.MouseEvent("dblclick", {
    bubbles: true, clientX: 190, clientY: 220,
  }));
  assert(photoImage.style.transform.endsWith("scale(1)"), "Double-click did not reset zoom");
  if (win.PointerEvent) {
    const pointerEvent = (type, pointerId, clientX) => new win.PointerEvent(type, {
      bubbles: true, pointerId, pointerType: "touch", isPrimary: pointerId === 1,
      clientX, clientY: 220,
    });
    photoViewport.dispatchEvent(pointerEvent("pointerdown", 1, 100));
    photoViewport.dispatchEvent(pointerEvent("pointerdown", 2, 150));
    photoViewport.dispatchEvent(pointerEvent("pointermove", 2, 200));
    assert(photoImage.style.transform.includes("scale(2)"), "Pinch gesture did not zoom the image");
    photoViewport.dispatchEvent(pointerEvent("pointerup", 1, 100));
    photoViewport.dispatchEvent(pointerEvent("pointerup", 2, 200));
    const previousTransform = photoImage.style.transform;
    photoViewport.dispatchEvent(pointerEvent("pointerdown", 1, 100));
    photoViewport.dispatchEvent(pointerEvent("pointermove", 1, 130));
    assert(photoImage.style.transform !== previousTransform, "Dragging did not pan the zoomed image");
    photoViewport.dispatchEvent(pointerEvent("pointerup", 1, 130));
  }
  const photoClosed = new Promise(resolve => photoDialog.addEventListener("close", resolve, {once:true}));
  doc.querySelector("#close-item-photo").click();
  await photoClosed;
  assert(!photoDialog.open && photoImage.style.transform === "", "Closing the viewer did not reset zoom");
  results.push("PASS Photo icon opens a viewer with wheel, double-click, pinch and pan zoom");

  photoButton.click();
  photoDialog.dispatchEvent(new win.MouseEvent("click", {bubbles: true}));
  assert(!photoDialog.open, "Tapping outside the image did not close the viewer");
  doc.querySelector('[aria-label="Bearbeiten: Tomaten"]').click();
  assert(!doc.querySelector("#edit-image-preview").hidden, "Saved image was not restored in the editor");
  doc.querySelector("#edit-image-remove").click();
  doc.querySelector("#edit-item-form").requestSubmit();
  await new Promise(resolve => win.setTimeout(resolve, 0));
  assert(operations.at(-1).metadata.image === null, "Image removal was not saved");
  api.state()[0].metadata.image = null;
  api.render();
  assert(!doc.querySelector('[aria-label="Foto von Tomaten anzeigen"]'), "Photo indicator remained after image removal");
  results.push("PASS Saved images can be reopened and removed");

  api.setMarket({id: "market", name: "Testmarkt", bonus_card: image, show_bonus_card: false});
  const cardButton = doc.querySelector("#market-bonus-card");
  const cardDialog = doc.querySelector("#bonus-card-dialog");
  const cardImage = doc.querySelector("#bonus-card-dialog-image");
  const cardClose = doc.querySelector("#close-bonus-card");
  assert(!cardButton.hidden, "Manual bonus card access depends on the cashier reminder setting");
  for (const width of [320, 390, 1280]) {
    frame.style.width = `${width}px`;
    await new Promise(resolve => win.requestAnimationFrame(resolve));
    cardButton.click();
    assert(cardDialog.open, "Direct bonus card access did not open the viewer");
    assert(cardImage.src === image && cardImage.alt === "Bonuskarte oder APP-Code für Testmarkt",
      "Bonus card image or accessible description changed");
    assert(cardDialog.querySelector("h2").textContent === "Bonuskarte / APP-Code", "Bonus card title missing");
    assert(cardClose.querySelector("svg") && cardClose.getAttribute("aria-label") === "Bild schließen",
      "Bonus card viewer is missing its accessible close icon");
    assert(doc.activeElement === cardClose, "Close icon is not initially focused");
    assert(cardDialog.querySelectorAll("button").length === 1 && !cardDialog.querySelector(".dialog-actions"),
      "Bonus card viewer still has a footer close button");
    const cardRect = cardDialog.getBoundingClientRect();
    const closeRect = cardClose.getBoundingClientRect();
    const viewportRect = cardDialog.querySelector(".item-photo-viewport").getBoundingClientRect();
    assert(cardRect.width <= width && cardDialog.scrollWidth <= cardDialog.clientWidth,
      `Bonus card viewer overflows at ${width}px`);
    cardImage.click();
    assert(cardDialog.open, "Clicking the bonus card image closed the viewer");
    cardClose.click();
    assert(!cardDialog.open, "Close icon did not close the bonus card viewer");
    photoDialog.showModal();
    assert(Math.abs(photoDialog.getBoundingClientRect().width - cardRect.width) < 1,
      `Photo viewer widths differ at ${width}px`);
    assert(Math.abs(doc.querySelector("#close-item-photo").getBoundingClientRect().width - closeRect.width) < 1,
      "Photo viewer close icon sizes differ");
    assert(Math.abs(photoViewport.getBoundingClientRect().height - viewportRect.height) < 1,
      "Photo viewer image area heights differ");
    photoDialog.close();
  }
  cardButton.click();
  cardDialog.dispatchEvent(new win.MouseEvent("click", {bubbles: true}));
  assert(!cardDialog.open, "Clicking the bonus card backdrop did not close the viewer");
  results.push("PASS Bonus card viewer matches the article photo UI at 320/390/1280px and closes via icon or backdrop");
  document.querySelector("#results").textContent = results.join("\n");
}
runTests().catch(error => {
  document.querySelector("#results").textContent = "FAIL " + error.stack;
  throw error;
});
</script>
